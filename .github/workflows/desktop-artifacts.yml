name: Build HeyMoa Desktop
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-policy:
    runs-on: ubuntu-24.04
    steps:
      - name: Require trusted dev or main source
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [[ "$SOURCE_REPOSITORY" != "team-minswon/heymoa-web" ]]; then
            echo "Build only in the trusted HeyMoa repository" >&2
            exit 1
          fi
          if [[ "$SOURCE_REF" != "refs/heads/dev" && "$SOURCE_REF" != "refs/heads/main" ]]; then
            echo "Manual builds require dev or main, not feature or arbitrary refs" >&2
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Require desktop package on selected source
        run: |
          if [[ ! -f apps/desktop/package.json ]]; then
            echo "Selected source has no desktop package; choose dev until desktop code is integrated into main" >&2
            exit 1
          fi
  package:
    needs: source-policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: mac:arm64
            artifact: mac-arm64
          - runner: macos-15-intel
            target: mac:x64
            artifact: mac-x64
          - runner: windows-2022
            target: win:x64
            artifact: win-x64
    runs-on: ${{ matrix.runner }}
    # Apple 공증이 끝나지 않아도 macOS 러너 분(일반의 10배)을 무한정 쓰지 않게 상한을 둔다.
    timeout-minutes: 40
    env:
      # Mac job 만 Developer ID 로 서명·공증하고 Windows 는 서명하지 않습니다.
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ startsWith(matrix.target, 'mac') && 'true' || 'false' }}
      CSC_LINK: ${{ startsWith(matrix.target, 'mac') && secrets.MAC_CERT_P12_BASE64 || '' }}
      CSC_KEY_PASSWORD: ${{ startsWith(matrix.target, 'mac') && secrets.MAC_CERT_PASSWORD || '' }}
      APPLE_API_KEY_ID: ${{ startsWith(matrix.target, 'mac') && secrets.APPLE_API_KEY_ID || '' }}
      APPLE_API_ISSUER: ${{ startsWith(matrix.target, 'mac') && secrets.APPLE_API_ISSUER || '' }}
      APPLE_API_KEY_P8_BASE64: ${{ startsWith(matrix.target, 'mac') && secrets.APPLE_API_KEY_P8_BASE64 || '' }}
      # 서명·공증이 어디서 오래 걸리는지 로그에 남긴다. 비밀 값은 GitHub 이 가린다.
      DEBUG: ${{ startsWith(matrix.target, 'mac') && 'electron-builder,electron-osx-sign*,@electron/notarize*' || '' }}
      NODE_OPTIONS: --no-experimental-webstorage
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for desktop renderer tests
        run: pnpm exec playwright install chromium
      - run: pnpm --filter @heymoa/desktop typecheck
      - run: pnpm --filter @heymoa/desktop test
      - name: Require signing secrets on Mac
        if: startsWith(matrix.target, 'mac')
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_KEY_P8_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "Missing secret for $name; refusing to build an unsigned Mac app" >&2
              exit 1
            fi
          done
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
      - run: pnpm --filter @heymoa/desktop package:${{ matrix.target }}
      - name: Verify Developer ID signature and notarization
        if: startsWith(matrix.target, 'mac')
        run: |
          shopt -s nullglob
          apps=(apps/desktop/release/mac*/HeyMoa.app)
          [[ ${#apps[@]} -gt 0 ]] || { echo "No HeyMoa.app found" >&2; exit 1; }
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv --verbose=2 "$app" 2>&1 | grep -E "Authority=Developer ID Application|flags=.*runtime"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: heymoa-${{ matrix.artifact }}
          if-no-files-found: error
          # 빌드 하나가 mac·win 합쳐 약 600MB 라 기본 90일이면 Actions 저장공간 0.5GB 를 넘겨 서버 CI 까지 막힙니다(APP-1051).
          retention-days: 3
          path: |
            apps/desktop/release/HeyMoa-*.dmg
            apps/desktop/release/HeyMoa-*.zip
            apps/desktop/release/HeyMoa-*.exe
            apps/desktop/release/SHA256SUMS
