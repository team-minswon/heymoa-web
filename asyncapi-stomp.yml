        DIFF_FOR_REVIEW)은 알리지 않는다. 화면은 받으면 GET /v1/notes/{noteId}/relations 를 다시 읽는다. 이벤트는 신호이고
        정본이 아니라, 유실되면 입장 · 재연결 때의 조회가 다시 맞춘다.
