        $ref: '#/components/schemas/MeetingAnalysisChangedPayload'
      examples:
        - name: summaryReady
          payload:
            type: meeting-analysis.changed
            occurredAt: '2026-08-25T01:02:03.456Z'
            status: ANALYZING
            regions:
              - region: SUMMARY
                status: SUCCEEDED
              - region: RELATIONS
                status: PENDING
              - region: ITEM_ENRICHMENT
