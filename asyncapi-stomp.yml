      description: |
        결과 본문은 싣지 않는다. 화면은 받으면 필요한 조회(흐름 · 요약 · 검토본)를 부른다. 이벤트는 신호이고 정본이 아니라,
        유실되면 화면은 GET /v1/notes/{noteId}/analyses/flow 로 다시 맞춘다. DIARIZING 은 이름만 옛 것이고 분석 전을 뜻한다.
