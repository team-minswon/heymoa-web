            occurredAt: '2026-10-07T01:02:03.456Z'
  schemas:
    Tsid:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{13}$'
      example: 0HZX2K7M9Q4AB
    RunId:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{13}$'
      description: heymoa-ai 가 만드는 멱등 키다. URL path 에 나가는 외부 식별자라 TSID 13자다.
    MeetingStatus:
      title: MeetingStatus
      description: 회의 상태. REST 의 같은 이름 enum 과 값 집합이 같다
      type: string
      enum: [NOT_STARTED, IN_PROGRESS, PAUSED, ENDED]
    UtcMillisTimestamp:
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$'
    ProposalKind:
      type: string
      enum: [AGENDA, DECISION, ACTION_ITEM, ISSUE, QUESTION, STATUS_REPORT, INSIGHT]
    ProposalChangedPayload:
      type: object
      additionalProperties: false
      required: [type, occurredAt, proposal]
      properties:
        type:
          type: string
          const: proposal.changed
        occurredAt:
          $ref: '#/components/schemas/UtcMillisTimestamp'
        proposal:
          $ref: '#/components/schemas/ProposalRevision'
    MeetingAnalysisChangedPayload:
      type: object
      additionalProperties: false
      required: [type, occurredAt, status, regions]
      properties:
        type:
          type: string
          const: meeting-analysis.changed
        occurredAt:
          $ref: '#/components/schemas/UtcMillisTimestamp'
        status:
          type: string
          enum: [NOT_APPLICABLE, DIARIZING, NOT_REQUESTED, ANALYZING, ANALYSIS_FAILED, REVIEWABLE, CONFIRMED]
        regions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [region, status]
            properties:
              region:
                type: string
                enum: [RELATIONS, EVALUATION, SUMMARY, ITEM_ENRICHMENT]
              status:
                type: string
                enum: [PENDING, SUCCEEDED, FAILED, SKIPPED]
    RelationChangedPayload:
      type: object
      additionalProperties: false
      required: [type, occurredAt, relations]
      properties:
        type:
          type: string
          const: relation.changed
        occurredAt:
          $ref: '#/components/schemas/UtcMillisTimestamp'
        relations:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [sourceProposalId, targetProposalId, kind, open]
            properties:
              sourceProposalId:
                $ref: '#/components/schemas/Tsid'
              targetProposalId:
                $ref: '#/components/schemas/Tsid'
              kind:
                type: string
                minLength: 1
              open:
                type: boolean
    AgendasChangedPayload:
      type: object
      additionalProperties: false
      required: [type, occurredAt]
      properties:
        type:
          type: string
          const: agendas.changed
        occurredAt:
          $ref: '#/components/schemas/UtcMillisTimestamp'
    TranscriptAnalysisRunAppliedPayload:
      type: object
      additionalProperties: false
      required: [type, occurredAt, range]
      properties:
        type:
          type: string
          const: transcript-analysis-run.applied
        occurredAt:
          $ref: '#/components/schemas/UtcMillisTimestamp'
        range:
          $ref: '#/components/schemas/TranscriptAnalysisRunRange'
    ProposalCitation:
      type: object
      additionalProperties: false
      required: [segmentId, sequence, startedAtMs, endedAtMs, text, role]
      properties:
        segmentId:
          $ref: '#/components/schemas/Tsid'
        sequence: {type: integer, format: int64, minimum: 1}
        startedAtMs: {type: integer, format: int64, minimum: 0}
        endedAtMs: {type: integer, format: int64, minimum: 0}
        text: {type: string}
        role:
          type: string
          enum: [SUPPORTS, REFUTES, CONDITIONS, RETRACTS, REFERENCES]
    ProposalRevision:
      type: object
      additionalProperties: false
      required: [proposalId, revision, operation, revisionSource, kind, status, closeReason, content, createdSequence, lastEvidenceSequence, aiSemanticRevisionCount, resolvesProposalId, citations]
      properties:
        proposalId:
          $ref: '#/components/schemas/Tsid'
        revision: {type: integer, format: int64, minimum: 1}
        operation:
          type: string
          enum: [CREATE, AMEND, CORRECT, RETRACT, RESOLVE]
          description: revision을 만든 operation event다. RESOLVE result revision도 CREATE가 아니라 RESOLVE다. status와 closeReason을 이 값에서 유도하지 않는다.
        revisionSource:
          type: string
          enum: [LIVE]
          description: v1 생산값은 LIVE다. POSTPROCESS는 실제 producer 이슈와 web parser의 선행 수용이 준비된 뒤 additive change로 추가한다.
        kind:
          $ref: '#/components/schemas/ProposalKind'
        status:
          type: string
          enum: [OPEN, CLOSED]
        closeReason:
          type: string
          nullable: true
          enum: [RETRACTED, RESOLVED, null]
        content:
          type: string
          minLength: 1
          maxLength: 500
          description: NFC이며 code point 500 이하다
        createdSequence: {type: integer, format: int64, minimum: 1}
        lastEvidenceSequence: {type: integer, format: int64, minimum: 1}
        aiSemanticRevisionCount: {type: integer, format: int32, minimum: 0}
        resolvesProposalId:
          type: string
          nullable: true
          pattern: '^[0-9A-HJKMNP-TV-Z]{13}$'
          description: RESOLVE result면 닫힌 Question proposal ID, 아니면 null
        citations:
          type: array
          items:
            $ref: '#/components/schemas/ProposalCitation'
      oneOf:
        - title: OpenProposal
          required: [status, closeReason]
          properties:
            status: {type: string, enum: [OPEN]}
            closeReason: {nullable: true, enum: [null]}
        - title: RetractedProposal
          required: [status, closeReason]
          properties:
            status: {type: string, enum: [CLOSED]}
            closeReason: {type: string, enum: [RETRACTED]}
        - title: ResolvedQuestion
          required: [kind, status, closeReason]
          properties:
            kind: {type: string, enum: [QUESTION]}
            status: {type: string, enum: [CLOSED]}
            closeReason: {type: string, enum: [RESOLVED]}
    TranscriptAnalysisRunRange:
      type: object
      additionalProperties: false
      required: [runId, applyStatus, fromSequence, toSequence, fromStartedAtMs, toEndedAtMs, rawDeltaSaturated, semanticUnitSaturated, appliedAt]
      properties:
        runId:
          $ref: '#/components/schemas/RunId'
        applyStatus:
          type: string
          enum: [APPLIED, PARTIAL_RECORDED]
        fromSequence: {type: integer, format: int64, minimum: 1}
        toSequence: {type: integer, format: int64, minimum: 1}
        fromStartedAtMs: {type: integer, format: int64, minimum: 0}
        toEndedAtMs: {type: integer, format: int64, minimum: 0}
        rawDeltaSaturated:
          type: boolean
          description: raw delta가 상한에 닿아 추가 항목이 있을 수 있다. 추가 항목이 반드시 있다는 뜻은 아니다.
        semanticUnitSaturated:
          type: boolean
          description: semantic unit 7개 상한 또는 limit drop으로 추가 항목이 있을 수 있다. 추가 항목이 반드시 있다는 뜻은 아니다.
        appliedAt:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$'
