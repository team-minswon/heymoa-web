# Tailscale Serve 뒤의 홈랩 오버레이. 브라우저에는 HTTPS origin 하나만 보인다.
#
# 시작: pnpm homelab:up
# 종료: pnpm homelab:down
# 접속: https://<이 장비의 MagicDNS>/__integration/login
#
# 테스트 로그인은 Tailscale Serve가 주입한 identity header가 없으면 403이다. edge 포트도
# loopback에만 열어 tailnet 밖에서 header를 흉내 내는 경로를 만들지 않는다.
services:
  server:
    environment:
      APP_WEB_BASEURL: ${HOMELAB_PUBLIC_URL:?HOMELAB_PUBLIC_URL is required}
      APP_API_BASEURL: ${HOMELAB_PUBLIC_URL:?HOMELAB_PUBLIC_URL is required}
      SERVER_FORWARD_HEADERS_STRATEGY: framework

  web:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: ${HOMELAB_PUBLIC_URL:?HOMELAB_PUBLIC_URL is required}

  auth-bootstrap:
    image: node:24-alpine
    command: ["node", "/app/homelab-login.mjs"]
    environment:
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-integration-access-secret-please-change-me-32}
      HOMELAB_PUBLIC_URL: ${HOMELAB_PUBLIC_URL:?HOMELAB_PUBLIC_URL is required}
      HOMELAB_RETURN_PATH: ${HOMELAB_RETURN_PATH:-/w/01K0000000010/notes/01K0000000031?view=full}
      PORT: 3001
    volumes:
      - ./homelab-login.mjs:/app/homelab-login.mjs:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  edge:
    image: caddy:2.10-alpine
    ports:
      - "127.0.0.1:${HOMELAB_EDGE_PORT:-18443}:8080"
    volumes:
      - ./Caddyfile.homelab:/etc/caddy/Caddyfile:ro
    depends_on:
      auth-bootstrap:
        condition: service_healthy
      web:
        condition: service_healthy
