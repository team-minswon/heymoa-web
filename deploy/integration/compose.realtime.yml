# 실시간 lane 오버레이. **기본 스택 위에 덮어 쓴다.**
#
#   docker compose -f compose.yml -f compose.realtime.yml up -d --build
#
# 기본 `compose.yml`은 각 레포의 **기본 브랜치**를 세운다. 거기에는 PRO-33 실시간 lane이
# 없다 — server `dev`에는 후보 원장 테이블이 없고(확인: `context_candidates` 부재), ai
# `feat/app-452`에는 분류기만 있고 그것을 부르는 worker가 없다.
#
# 이 파일은 **아직 머지되지 않은 두 브랜치의 워크트리**를 build context로 가리켜 lane을
# 세운다. 소유는 각 pane이고 **여기서는 참조만 한다 — 그 레포의 파일을 고치지 않는다.**
#
# | 조각 | 브랜치 | 무엇이 들어 있나 |
# |---|---|---|
# | server | `feature/app-459/candidate-revision-delivery` | 후보 원장 10개 테이블(V30), 내부 snapshot·apply, **web용 조회 `GET /v1/notes/{noteId}/context-candidates`**, window 절단 경계 고정 |
# | ai | `integration/pro-33-ai` | `live_dispatch.py` worker, 프롬프트 출력 키 수정, apply payload의 `contextFromSequence` 송신 |
#
# **server context 가 app-453 이 아니라 app-459 다.** app-459 가 app-453 의
# `572d13e`(window 절단 고정)를 이미 품은 상위집합이고, 거기에 web 이 실제로 읽는 조회
# 경로가 얹혀 있다. 둘 다 필요하므로 상위집합 하나만 세운다.
#
#   git -C <server>/.worktrees/pro-33-integration log -1   # → 3ca943d, clean
#
# **잠정값이던 app-459 를 걷고 최종 integration 워크트리로 옮겼다.** app-459 는 `01c76e5`
# 기반이라 최신 dev 뒤였고 워킹 트리도 dirty 였다 — 그 상태를 이미지로 굳히면 편집 중간
# 상태를 읽는다. `pro-33-integration` 은 셋을 모두 만족한다.
#
#   clean · 최신 origin/dev 포함 · APP-476 partial 두 토막 · APP-459 후보 조회
#
# **web 화면이 후보를 봅니다.** 이전 판에는 「web은 여전히 후보를 못 봅니다」라고 적혀
# 있었는데, 그것은 APP-459 조회가 어느 브랜치에도 없던 시점의 사실이다. 지금은 컨트롤러와
# 생성 계약이 모두 있어 **전사 → 분류 → 원장 → 화면**까지가 한 스택에서 확인된다.
#
# web 은 **최종 생성 계약을 반영한 브랜치 자체를 build 한다** — 기본 `compose.yml`의 web
# 서비스가 이 워크트리를 가리키므로 여기서 덮어쓰지 않는다.

services:
  server:
    build:
      context: ${SERVER_LEDGER_ROOT:-../../../../../heymoa-server/.worktrees/pro-33-integration}
      dockerfile: deploy/app/Dockerfile

  ai:
    build:
      context: ${AI_LIVE_ROOT:-/home/min/.cache/claude-worktrees/heymoa-ai-combined2}
    environment:
      # 이 플래그가 없으면 `container.py`가 worker를 조립하지 않고 lane이 통째로 안 돈다.
      LIVE_CONTEXT_ENABLED: "true"
      # **기본값이 `http://localhost:8080`이라 컨테이너 안에서 자기 자신을 본다.**
      # 그래서 worker 의 discovery 폴링이 매초 `LiveRetryableError` 로 격리됐다.
      SERVER_BASE_URL: http://server:8080
      # server 의 `INTERNAL_API_TOKEN` 과 같아야 한다. 다르면 401 로 같은 증상이 난다.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-integration-internal-token}
      # ── 외부 trace 를 막는다 ────────────────────────────────────────────
      # 통합 스택은 실제 회의 전사를 돌린다. 그 내용이 외부 관측 서비스로 나가면 안 된다.
      # **`environment` 가 `env_file` 보다 우선**하므로, 이미지 안의 `.env` 에 키가 있어도
      # 여기서 빈 값으로 덮으면 전송이 서지 않는다. 빈 문자열이어야 한다 — 키를 지우는 것과
      # 값이 없는 것은 다르고, 클라이언트는 후자를 「비활성」으로 읽는다.
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_SECRET_KEY: ""
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_TRACING: "false"
      # ai 의 Docker `CMD` 가 `opentelemetry-instrument` 라, 위 셋을 껐어도 SDK 자신은
      # 여전히 기본 exporter 로 내보내려 한다. `.env` 에 OTEL 값이 없어도 그 시도와 로그
      # 잡음이 남으므로 server 와 같이 여기서 명시적으로 끈다.
      OTEL_SDK_DISABLED: "true"
    # ── 걷은 것 ──────────────────────────────────────────────────────────
    # 이전 판에는 `prompts.yml` 한 파일을 읽기 전용으로 덮는 임시 마운트가 있었다.
    # 실시간 분류기 프롬프트에 출력 JSON 키 이름(`role`)이 빠져 모든 delta 가
    # `SCHEMA_INVALID` 로 떨어졌고, 그 수정이 다른 pane 소유 브랜치에만 있었기 때문이다.
    #
    # **`integration/pro-33-ai` 가 그 수정을 품어서 지웠다.** 확인:
    #
    #   diff -q <app458>/src/heymoa/infrastructure/config/prompts.yml \
    #           <combined2>/src/heymoa/infrastructure/config/prompts.yml   # → 동일
    #
    # 되살릴 일이 있다면 그것은 마운트가 아니라 build context 가 틀린 것이다.

  ai-migrate:
    build:
      context: ${AI_LIVE_ROOT:-/home/min/.cache/claude-worktrees/heymoa-ai-combined2}
