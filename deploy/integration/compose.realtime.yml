# 실시간 lane 오버레이. **기본 스택 위에 덮어 쓴다.**
#
#   docker compose -f compose.yml -f compose.realtime.yml up -d --build
#
# 기본 `compose.yml`은 각 레포의 **기본 브랜치**를 세운다. 거기에는 PRO-33 실시간 lane이
# 없다 — server `dev`에는 후보 원장 테이블이 없고(확인: `context_candidates` 부재), ai
# `feat/app-452`에는 분류기만 있고 그것을 부르는 worker가 없다.
#
# 이 파일은 **아직 머지되지 않은 두 브랜치의 워크트리**를 build context로 가리켜 lane을
# 세운다. 소유는 각 pane이고 **여기서는 참조만 한다 — 그 레포의 파일을 고치지 않는다.**
#
# | 조각 | 어디 | 무엇이 들어 있나 |
# |---|---|---|
# | server | `heymoa-server/.worktrees/app-453` | `V30__context_classification_store.sql`(후보 원장 10개 테이블), `InternalContextClassificationController`(snapshot·apply) |
# | ai | `~/.cache/codex-worktrees/heymoa-ai-app466` | `infrastructure/workers/live_dispatch.py`, `LIVE_CONTEXT_ENABLED` |
#
# **web 화면은 여전히 후보를 못 봅니다** — 사용자용 조회(APP-459)는 아직 어느 브랜치에도
# 없습니다. 이 오버레이로 검증할 수 있는 것은 **전사 → 분류 → 원장 저장까지의 왕복**이고,
# 확인은 DB를 직접 읽어서 합니다.

services:
  server:
    build:
      context: ${SERVER_LEDGER_ROOT:-../../../../../heymoa-server/.worktrees/app-453}
      dockerfile: deploy/app/Dockerfile

  ai:
    build:
      context: ${AI_LIVE_ROOT:-/home/min/.cache/codex-worktrees/heymoa-ai-app466}
    environment:
      # 이 플래그가 없으면 `container.py`가 worker를 조립하지 않고 lane이 통째로 안 돈다.
      LIVE_CONTEXT_ENABLED: "true"
      # **기본값이 `http://localhost:8080`이라 컨테이너 안에서 자기 자신을 본다.**
      # 그래서 worker 의 discovery 폴링이 매초 `LiveRetryableError` 로 격리됐다.
      SERVER_BASE_URL: http://server:8080
      # server 의 `INTERNAL_API_TOKEN` 과 같아야 한다. 다르면 401 로 같은 증상이 난다.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-integration-internal-token}
    # ── 걷을 것 ──────────────────────────────────────────────────────────
    # 아래 `volumes` 는 **임시다.** APP-466 브랜치에 정식 prompt 수정과 stale(window 범위)
    # 수정이 들어오면 통째로 지운다. 지우는 조건과 확인 방법:
    #
    #   1. `feat/app-466/live-dispatch` 에 `prompts.yml` 의 출력 키 이름 수정이 들어왔는가
    #      → `grep -c '"role"' <ai-worktree>/src/heymoa/infrastructure/config/prompts.yml`
    #   2. 지운 뒤 한 번 돌려 `context_classification_runs` 에 `SCHEMA_INVALID` drop 이
    #      0 인가 → 0 이면 마운트가 필요 없다
    #
    # 걷는 방법: 아래 `volumes:` 블록 두 줄을 지우고 `docker compose ... up -d --build ai`.
    volumes:
      # **APP-452 프롬프트 수정을 얹는다.** `feat/app-458/ledger-analysis-input@60a91f2` 의
      # `prompts.yml` 한 파일이다 — 실시간 분류기 프롬프트에 출력 JSON 키 이름(`role`)이
      # 빠져 있어 모델이 `{"type": ...}` 로 내고 전부 `SCHEMA_INVALID` 로 떨어졌다.
      #
      # APP-452 는 다른 pane 소유라 병합하지 않고 **파일 하나만 마운트로 덮는다.**
      # 그 수정이 APP-466 브랜치에 들어오면 이 줄을 지운다.
      - ${AI_PROMPT_FIX:-/home/min/.cache/claude-worktrees/heymoa-ai-app458/src/heymoa/infrastructure/config/prompts.yml}:/app/src/heymoa/infrastructure/config/prompts.yml:ro

  ai-migrate:
    build:
      context: ${AI_LIVE_ROOT:-/home/min/.cache/codex-worktrees/heymoa-ai-app466}
