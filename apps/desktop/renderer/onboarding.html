<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title data-i18n>HeyMoa 시작하기</title>
    <link rel="stylesheet" href="onboarding.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="onboarding-logo.png" width="48" height="48" alt="" /><span
          >HeyMoa <small>DESKTOP</small></span
        >
      </header>
      <label class="language">Language / 언어
        <select id="language" aria-label="Language / 언어"><option value="ko">한국어</option><option value="en">English</option></select>
      </label>
      <p class="language-hint"><span data-i18n>로그인 후에는 계정의 언어 설정을 따릅니다.</span></p>
      <div class="intro">
        <h1><span data-i18n>녹음 준비</span></h1>
        <p><span data-i18n>마이크로 들어오는 대화와 화상회의·강의 소리를 기록합니다.</span></p>
      </div>
      <section data-i18n-aria-label="소리 설정" aria-label="소리 설정">
        <article>
          <span class="number" aria-hidden="true">01</span>
          <div class="details">
            <h2><span data-i18n>내 목소리</span><span id="microphone-status" class="badge"><span data-i18n>확인 중</span></span>
            </h2>
            <p><span data-i18n>내 목소리와 주변 대화를 기록합니다. 마이크 사용을 허용해 주세요.</span></p>
          </div>
          <button id="microphone-action" class="secondary"><span data-i18n>마이크 허용</span></button>
        </article>
        <article>
          <span class="number" aria-hidden="true">02</span>
          <div class="details">
            <h2><span data-i18n>컴퓨터 소리</span><span class="badge"><span data-i18n>첫 녹음 때 확인</span></span></h2>
            <p id="audio-description"><span data-i18n>컴퓨터에서 들리는 회의 소리를 함께 기록해요. 실제 연결은 녹음을 시작할 때 확인합니다.</span></p>
          </div>
          <button id="audio-action" class="secondary" hidden><span data-i18n>설정 열기</span></button>
        </article>
      </section>
      <div class="recheck">
        <p><span data-i18n>여기에서는 녹음을 시작하지 않아요.</span></p>
        <button id="recheck"><span data-i18n>다시 확인 ↻</span></button>
      </div>
      <p id="error" role="status" aria-live="polite"></p>
      <footer>
        <button id="complete" class="primary"><span data-i18n>HeyMoa 시작하기</span></button>
        <p><span data-i18n>권한은 나중에도 변경할 수 있어요.</span></p>
      </footer>
    </main>
    <script src="onboarding-renderer.js"></script>
  </body>
</html>
