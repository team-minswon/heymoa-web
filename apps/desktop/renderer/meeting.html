<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title data-i18n>HeyMoa · 현재 회의</title>
    <link rel="stylesheet" href="meeting.css" />
  </head>
  <body>
    <header>
      <div class="status">
        <i></i><span id="phase"><span data-i18n>녹음 대기</span></span><time id="elapsed"></time>
      </div>
      <button id="close" data-i18n-aria-label="팝오버 닫기" aria-label="팝오버 닫기" data-i18n-title="닫기" title="닫기">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6 18 18M18 6 6 18" />
        </svg>
      </button>
    </header>
    <h1 id="title"><span data-i18n>녹음 대기</span></h1>
    <nav data-i18n-aria-label="타임라인 유형" aria-label="타임라인 유형" id="filters"></nav>
    <p id="notice" role="status"></p>
    <main id="scroll" tabindex="0" data-i18n-aria-label="회의 타임라인" aria-label="회의 타임라인">
      <div id="meetings" hidden></div>
      <div id="items"></div>
      <p id="empty"><span data-i18n>녹음 중인 회의가 없습니다.</span></p>
    </main>
    <button
      id="latest"
      data-i18n-aria-label="최신 항목으로 이동" aria-label="최신 항목으로 이동"
      data-i18n-title="최신 항목으로 이동" title="최신 항목으로 이동"
      hidden
    >
      ↓
    </button>
    <footer>
      <button id="open"><span data-i18n>HeyMoa 열기 ↗</span></button
      ><button id="stop" disabled><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="4" width="4" height="16" rx="1" /><rect x="6" y="4" width="4" height="16" rx="1" /></svg></span><span>녹음 일시정지</span></button>
    </footer>
    <script src="meeting-renderer.js"></script>
  </body>
</html>
