<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title data-i18n>HeyMoa · 현재 회의</title>
    <link rel="stylesheet" href="meeting.css" />
  </head>
  <body>
    <header>
      <div class="status">
        <i></i><span id="phase"><span data-i18n>녹음 대기</span></span
        ><time id="elapsed"></time>
      </div>
      <div class="window-controls">
        <button
          id="settings"
          data-i18n-aria-label="데스크톱 설정"
          aria-label="데스크톱 설정"
          data-i18n-title="데스크톱 설정"
          title="데스크톱 설정"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M4 7h16M4 17h16" />
            <circle cx="9" cy="7" r="3" fill="var(--canvas)" />
            <circle cx="15" cy="17" r="3" fill="var(--canvas)" />
          </svg>
        </button>
        <button
          id="pin"
          aria-pressed="false"
          data-i18n-aria-label="항상 위에 고정"
          aria-label="항상 위에 고정"
          data-i18n-title="항상 위에 고정"
          title="항상 위에 고정"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 17v5" />
            <path
              class="pin-head"
              d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"
            />
          </svg>
        </button>
        <button
          id="close"
          data-i18n-aria-label="팝오버 닫기"
          aria-label="팝오버 닫기"
          data-i18n-title="닫기"
          title="닫기"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M6 6 18 18M18 6 6 18" />
          </svg>
        </button>
      </div>
    </header>
    <h1 id="title"><span data-i18n>녹음 대기</span></h1>
    <p id="notice" role="status"></p>
    <main
      id="scroll"
      tabindex="0"
      data-i18n-aria-label="회의 타임라인"
      aria-label="회의 타임라인"
    >
      <div id="meetings" hidden></div>
      <div id="items"></div>
      <p id="empty"><span data-i18n>녹음 중인 회의가 없습니다.</span></p>
    </main>
    <button
      id="latest"
      data-i18n-aria-label="최신 항목으로 이동"
      aria-label="최신 항목으로 이동"
      data-i18n-title="최신 항목으로 이동"
      title="최신 항목으로 이동"
      hidden
    >
      ↓
    </button>
    <footer>
      <button id="open"><span data-i18n>HeyMoa 열기 ↗</span></button
      ><button id="stop" disabled>
        <span aria-hidden="true"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="14" y="4" width="4" height="16" rx="1" />
            <rect x="6" y="4" width="4" height="16" rx="1" /></svg></span
        ><span>녹음 일시정지</span>
      </button>
    </footer>
    <script src="meeting-renderer.js"></script>
  </body>
</html>
