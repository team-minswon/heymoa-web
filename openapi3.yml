        in: "query"
        description: "복수 지정 시 OR. 생략하면 전체"
        required: false
        style: "form"
        explode: false
        schema:
          type: "array"
          items:
            type: "string"
            enum:
            - "NOT_STARTED"
            - "IN_PROGRESS"
            - "PAUSED"
            - "ENDED"
        example: "IN_PROGRESS,PAUSED"
      - name: "projectId"
        in: "query"
        required: false
        schema:
          type: "string"
          pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
      - name: "sort"
        in: "query"
        description: "「예정」과 「지난」은 정렬 축이 달라 한 번에 못 나온다 — 클라이언트가 두 번 부른다"
        required: false
        schema:
          type: "string"
          default: "updatedAt_desc"
          enum:
          - "scheduledAt_asc"
          - "startedAt_desc"
          - "updatedAt_desc"
      - name: "cursor"
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "limit"
        in: "query"
        required: false
        schema:
          type: "integer"
          default: 30
          minimum: 1
          maximum: 100
