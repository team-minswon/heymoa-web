  /v1/agent-chats/active:
    get:
      tags:
      - "AgentChat"
      summary: "활성 세션 조회"
      description: "scope와 대상 식별자가 일치하지 않으면 400으로 응답한다 (workspace→workspaceId 필수,\
        \ note→noteId 필수)."
      operationId: "getActiveAgentChat"
      parameters:
      - name: "scope"
        in: "query"
        description: "컨텍스트 범위 (workspace: 워크스페이스 전체, note: 노트 단건)"
        required: true
        schema:
          type: "string"
          description: "컨텍스트 범위 (workspace: 워크스페이스 전체, note: 노트 단건)"
          nullable: false
          enum:
          - "workspace"
          - "note"
        example: "workspace"
      - name: "workspaceId"
        in: "query"
        description: "조회할 워크스페이스 TSID (scope=workspace일 때 필수)"
        required: false
        schema:
          type: "string"
          description: "조회할 워크스페이스 TSID (scope=workspace일 때 필수)"
          nullable: false
          pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
          minLength: 13
          maxLength: 13
        example: "0HZX2K7M9Q4AD"
      - name: "noteId"
        in: "query"
        description: "조회할 노트 TSID (scope=note일 때 필수)"
        required: false
        schema:
          type: "string"
          description: "조회할 노트 TSID (scope=note일 때 필수)"
          nullable: false
          pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
          minLength: 13
          maxLength: 13
        example: "0HZX2K7M9Q4AF"
