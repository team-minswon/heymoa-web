components:
  schemas:
    AgentChatsResponse:
      title: AgentChatsResponse
      required:
      - data
      - error
      - success
      type: object
      properties:
        data:
          required:
          - chats
          type: object
          properties:
            chats:
              type: array
              description: 최근 50개. updatedAt 내림차순
              items:
                required:
                - chatId
                - title
                - updatedAt
                - runningTurn
                type: object
                properties:
                  runningTurn:
                    required:
                    - turnId
                    - status
                    type: object
                    properties:
                      turnId:
                        type: string
                        description: 도는 턴의 13자리 TSID
                        nullable: false
                        example: 0K9GVJT2C4Q3B
                        pattern: ^[0-9A-HJKMNP-TV-Z]{13}$
                        minLength: 13
                        maxLength: 13
                      status:
                        type: string
                        description: '**둘뿐이다** — IN_PROGRESS 와 WAITING_APPROVAL. 확정된 턴은 여기 안 들어온다'
                        nullable: false
                        example: WAITING_APPROVAL
                        enum:
                        - IN_PROGRESS
                        - WAITING_APPROVAL
                    description: 살아 있는 턴. 없으면 null 이고 그때 이 줄에는 배지가 안 붙는다. **본문도 대기 중인 승인도 안 싣는다** — 목록은 폴링으로 돌고 50개분 본문이 주기마다 흐를 이유가 없다
                    nullable: true
                  chatId:
                    type: string
                    description: 대화의 13자리 TSID
                    nullable: false
                    example: 0K9GVJT2C4Q2A
                    pattern: ^[0-9A-HJKMNP-TV-Z]{13}$
                    minLength: 13
                    maxLength: 13
                  title:
                    type: string
                    description: 대화 제목. **절대 null 이 아니다** — 빈 값이면 「새 대화」다
                    nullable: false
                    example: 배포 게이트를 만들어줘
                  updatedAt:
                    type: string
                    description: 마지막 활동 시각
                    nullable: false
                    example: '2026-07-14T01:02:03Z'
                    format: date-time
              nullable: false
          description: 성공 응답 데이터
          nullable: false
        success:
          type: boolean
          description: 요청 성공 여부
          nullable: false
          example: true
        error:
          nullable: true
          enum:
          - null
          description: 성공 시 null인 오류 정보
    WorkspaceResponse:
      title: WorkspaceResponse
      required:
      - data
      - error
      - success
      type: object
      properties:
        data:
          required:
          - description
          - name
          - role
          - workspaceId
          type: object
          properties:
            role:
              type: string
              description: 현재 사용자의 워크스페이스 역할
              nullable: false
              example: ADMIN
              enum:
              - ADMIN
              - MEMBER
            name:
              type: string
              description: 워크스페이스 이름
              nullable: false
              example: 제품 팀
              maxLength: 100
            description:
              type: string
              description: 워크스페이스 설명
              nullable: true
              example: 제품을 만드는 팀의 워크스페이스
              maxLength: 1000
            workspaceId:
              type: string
              description: 워크스페이스의 13자리 TSID
              nullable: false
              example: 0HZX2K7M9Q4AD
              pattern: ^[0-9A-HJKMNP-TV-Z]{13}$
              minLength: 13
              maxLength: 13
          description: 성공 응답 데이터
          nullable: false
        success:
          type: boolean
          description: 요청 성공 여부
          nullable: false
          example: true
        error:
          nullable: true
          enum:
          - null
          description: 성공 시 null인 오류 정보
    CurrentTranscriptionSessionNullableResponse:
      title: CurrentTranscriptionSessionNullableResponse
      required:
      - error
      - success
      - data
      type: object
      properties:
        data:
          required:
          - noteId
          - readyExpiresAt
          - sessionId
          - startedAt
          - status
          type: object
          properties:
            readyExpiresAt:
              type: string
              description: 전사 연결 대기 만료 시각
              nullable: false
              example: '2026-07-14T01:02:03Z'
              format: date-time
            noteId:
              type: string
              description: 노트의 13자리 TSID
              nullable: false
              example: 0HZX2K7M9Q4AF
