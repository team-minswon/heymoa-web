      description: 노트의 **계정 참여자**를 요청한 목록으로 통째로 교체한다. 부분 추가·삭제가 아니며, 빈 배열이면 계정 참여자를 전원 지운다. 워크스페이스 멤버 또는 이미 이 회의의 참여자만 이 목록에 들어갈 수 있다 - 멤버를 내보내도 참여 기록은 남으므로, 전체 교체에서 그 사람을 함께 실어 유지할 수 있다. 참여자가 아니었던 사람은 넣을 수 없다. 회의 상태와 무관하게 언제나 호출할 수 있다. 계정 없는 임시 참여자는 이 요청이 건드리지 않으므로 응답에 그대로 남는다 - 그쪽은 /v1/notes/{noteId}/participants/guests 가 맡는다.
