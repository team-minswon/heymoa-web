      - "WorkspaceIntegration"
      summary: "워크스페이스 연동 콜백"
      description: "provider OAuth 콜백을 처리하고 웹으로 리다이렉트한다. (permitAll) redirect URI는\
        \ provider에 사전 등록된 고정 경로여야 하므로 워크스페이스 경로를 쓰지 않는다 — workspaceId는 서명된 state에\
