                $ref: '#/components/schemas/AppErrorResponse'
              examples:
                BAD_REQUEST:
                  value:
                    success: false
                    data: null
                    error:
                      code: BAD_REQUEST
                      message: 잘못된 요청입니다.
                      details: null
        '404':
          description: 요청한 리소스를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              examples:
                APPROVAL_NOT_FOUND:
                  value:
                    success: false
                    data: null
                    error:
                      code: APPROVAL_NOT_FOUND
                      message: 승인 요청을 찾을 수 없습니다.
                      details: null
        '403':
          description: 권한 없음
