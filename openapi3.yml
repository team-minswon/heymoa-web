        in: "path"
        description: "연동 provider (LINEAR, GITHUB)"
        required: true
        schema:
          type: "string"
          description: "연동 provider (LINEAR, GITHUB)"
          nullable: false
          enum:
          - "LINEAR"
          - "GITHUB"
        example: "LINEAR"
      - name: "code"
        in: "query"
        description: "provider가 발급한 authorization code (성공 콜백)"
        required: false
        schema:
          type: "string"
          description: "provider가 발급한 authorization code (성공 콜백)"
          nullable: false
        example: "auth-code"
      - name: "state"
        in: "query"
        description: "서명된 OAuth state (성공 콜백)"
        required: false
