                    type: string
                    description: 최초 ACTIVE 전사 세션의 시작 시각 (한 번도 ACTIVE가 아니면 null)
                    nullable: true
                    example: '2026-07-14T01:02:03Z'
                    format: date-time
                  createdAt:
                    type: string
                    description: 노트 생성 시각
                    nullable: false
                    example: '2026-07-14T01:02:03Z'
                    format: date-time
                  lastRecordedAt:
                    type: string
                    description: 가장 최근 종료된 전사 세션의 시작 시각
                    nullable: true
                    example: '2026-07-14T01:02:03Z'
                    format: date-time
                  meetingStartedBy:
                    type: object
                    properties:
                      image:
                        type: string
                        description: 회의 시작자 프로필 이미지 URL (없으면 null)
                        nullable: true
                        example: https://cdn.example.com/avatars/hong.png
                      name:
                        type: string
                        description: 회의 시작자 이름
                        nullable: false
                        example: 홍길동
                      userId:
                        type: string
                        description: 회의 시작자의 13자리 TSID
                        nullable: false
                        example: 0HZX2K7M9Q4AC
                        pattern: ^[0-9A-HJKMNP-TV-Z]{13}$
                        minLength: 13
                        maxLength: 13
                      email:
                        type: string
                        description: 회의 시작자 이메일
                        nullable: false
                        example: hong@example.com
                    description: 회의 시작자 (녹음을 최초로 시작한 유저, 녹음 전이면 null)
                    nullable: true
                    required:
                    - userId
                    - name
                    - email
                    - image
                  recordedDurationMs:
                    type: integer
                    description: ACTIVE였고 종료된 COMPLETED/INTERRUPTED 세션의 startedAt~endedAt 구간만 합산한 누적 녹음 시간(ms), READY 중단과 진행 중 구간은 0
                    nullable: false
                    example: 6500
                    format: int64
                    minimum: 0
                  meetingStatus:
                    type: string
                    description: 회의 상태
                    nullable: false
                    example: IN_PROGRESS
                    enum:
                    - NOT_STARTED
                    - IN_PROGRESS
                    - PAUSED
                    - ENDED
                  noteId:
                    type: string
                    description: 노트의 13자리 TSID
                    nullable: false
                    example: 0HZX2K7M9Q4AF
                    pattern: ^[0-9A-HJKMNP-TV-Z]{13}$
                    minLength: 13
                    maxLength: 13
                  title:
                    type: string
                    description: 노트 제목
                    nullable: false
                    example: 주간 회의
                    maxLength: 200
                  projectId:
                    type: string
                    description: 프로젝트의 13자리 TSID
                    nullable: false
                    example: 0HZX2K7M9Q4AE
                    pattern: ^[0-9A-HJKMNP-TV-Z]{13}$
                    minLength: 13
                    maxLength: 13
                  activeSessionStartedAt:
                    type: string
                    description: 현재 ACTIVE 전사 세션의 시작 시각 (READY 또는 활성 세션이 없으면 null)
                    nullable: true
                    example: '2026-07-14T01:02:03Z'
                    format: date-time
                  participants:
                    type: array
                    description: 회의 참여자 목록. 워크스페이스 멤버와 계정 없는 임시 참여자가 섞여 이름 오름차순이다. 없으면 빈 배열
                    items:
                      required:
                      - name
                      - participantId
                      - userId
                      - guestId
                      - email
                      - image
                      type: object
                      properties:
                        participantId:
                          type: string
                          description: 참여 기록의 13자리 TSID. 화자 지정이 가리키는 값이다
                          nullable: false
                          example: 0HZX2K7M9Q4AP
                          pattern: ^[0-9A-HJKMNP-TV-Z]{13}$
                          minLength: 13
                          maxLength: 13
                        image:
                          type: string
                          description: 참여자 프로필 이미지 URL (없거나 임시 참여자면 null)
                          nullable: true
                          example: https://cdn.example.com/avatars/hong.png
                        name:
                          type: string
                          description: 참여자 이름. 계정 이름이거나 임시 참여자 이름이며 항상 있다
                          nullable: false
                          example: 홍길동
                        guestId:
                          type: string
                          description: 임시 참여자의 13자리 TSID (계정 참여자면 null)
                          nullable: true
                          example: 0HZX2K7M9Q4AR
                          pattern: ^[0-9A-HJKMNP-TV-Z]{13}$
                          minLength: 13
                          maxLength: 13
                        userId:
                          type: string
                          description: 계정 참여자의 13자리 TSID (임시 참여자면 null)
                          nullable: true
                          example: 0HZX2K7M9Q4AC
                          pattern: ^[0-9A-HJKMNP-TV-Z]{13}$
                          minLength: 13
                          maxLength: 13
                        email:
                          type: string
                          description: 참여자 이메일 (임시 참여자면 null)
                          nullable: true
                          example: hong@example.com
                    nullable: false
                  updatedAt:
                    type: string
                    description: 노트 수정 시각
                    nullable: false
                    example: '2026-07-14T01:02:03Z'
                    format: date-time
              nullable: false
          description: 성공 응답 데이터
          nullable: false
        success:
          type: boolean
          description: 요청 성공 여부
          nullable: false
          example: true
        error:
          nullable: true
          enum:
          - null
          description: 성공 시 null인 오류 정보
    CandidateRevisionReference:
      title: CandidateRevisionReference
      type: object
      required:
      - candidateId
      - revision
      additionalProperties: false
      properties:
        candidateId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{13}$
          example: 0K9GVJT2C4Q2B
        revision:
          type: integer
          format: int64
          minimum: 1
          example: 9
    Tsid:
      type: string
      pattern: ^[0-9A-HJKMNP-TV-Z]{13}$
      minLength: 13
      maxLength: 13
    RunKey:
      type: string
      pattern: ^[0-9A-HJKMNP-TV-Z]{13}$
      minLength: 13
      maxLength: 13
      description: heymoa-ai 가 만드는 멱등 키다. URL path 에 나가는 외부 식별자라 TSID 13자다.
    CandidateKind:
      type: string
      enum:
      - AGENDA
      - DECISION
      - ACTION_ITEM
      - ISSUE
      - QUESTION
      - STATUS_REPORT
      - INSIGHT
    ContextCandidateEvidence:
      type: object
      additionalProperties: false
      required:
      - segmentId
      - sequence
      - startedAtMs
      - endedAtMs
      - text
      - role
      properties:
        segmentId:
          $ref: '#/components/schemas/Tsid'
        sequence:
          type: integer
          format: int64
          minimum: 1
        startedAtMs:
          type: integer
          format: int64
          minimum: 0
        endedAtMs:
          type: integer
          format: int64
          minimum: 0
        text:
          type: string
        role:
          type: string
          enum:
          - SUPPORTS
          - REFUTES
          - CONDITIONS
          - RETRACTS
          - REFERENCES
    ContextCandidateRevision:
      type: object
      additionalProperties: false
      required:
      - candidateId
      - revision
      - operation
      - revisionSource
      - kind
      - status
      - closeReason
      - content
      - createdSequence
      - lastEvidenceSequence
      - aiSemanticRevisionCount
      - resolvesCandidateId
      - evidence
      properties:
        candidateId:
          $ref: '#/components/schemas/Tsid'
        revision:
          type: integer
          format: int64
          minimum: 1
        operation:
          type: string
          enum:
          - CREATE
          - AMEND
          - CORRECT
          - RETRACT
          - RESOLVE
          description: revision을 만든 operation event다. RESOLVE result revision도 CREATE가 아니라 RESOLVE다. status와 closeReason을 이 값에서 유도하지 않는다.
        revisionSource:
          type: string
          enum:
          - LIVE
          description: v1 생산값은 LIVE다. POSTPROCESS는 실제 producer 이슈와 web parser의 선행 수용이 준비된 뒤 additive change로 추가한다.
        kind:
          $ref: '#/components/schemas/CandidateKind'
        status:
          type: string
          enum:
          - OPEN
          - CLOSED
        closeReason:
          type: string
          nullable: true
          enum:
          - RETRACTED
          - RESOLVED
          - null
        content:
          type: string
          minLength: 1
          maxLength: 500
          description: NFC이며 classifier tiktoken:0.13.0:o200k_base 기준 512 tokens 이하다
        createdSequence:
          type: integer
          format: int64
          minimum: 1
        lastEvidenceSequence:
          type: integer
          format: int64
          minimum: 1
        aiSemanticRevisionCount:
          type: integer
          format: int32
          minimum: 0
        resolvesCandidateId:
          type: string
          nullable: true
          pattern: ^[0-9A-HJKMNP-TV-Z]{13}$
          minLength: 13
          maxLength: 13
          description: RESOLVE result면 닫힌 Question candidate ID, 아니면 null
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/ContextCandidateEvidence'
      oneOf:
      - title: OpenCandidate
        required:
        - status
        - closeReason
        properties:
          status:
            type: string
            enum:
            - OPEN
          closeReason:
            nullable: true
            enum:
            - null
      - title: RetractedCandidate
        required:
        - status
        - closeReason
        properties:
          status:
            type: string
            enum:
            - CLOSED
          closeReason:
            type: string
            enum:
            - RETRACTED
      - title: ResolvedQuestion
        required:
        - kind
        - status
        - closeReason
        properties:
          kind:
            type: string
            enum:
            - QUESTION
          status:
            type: string
            enum:
            - CLOSED
          closeReason:
            type: string
            enum:
            - RESOLVED
    ContextClassificationAppliedRange:
      type: object
      additionalProperties: false
      required:
      - runKey
      - applyStatus
      - fromSequence
      - toSequence
      - fromStartedAtMs
      - toEndedAtMs
      - rawDeltaSaturated
      - semanticUnitSaturated
      - appliedAt
      properties:
        runKey:
          $ref: '#/components/schemas/RunKey'
        applyStatus:
          type: string
          enum:
          - APPLIED
          - PARTIAL_RECORDED
        fromSequence:
          type: integer
          format: int64
          minimum: 1
        toSequence:
          type: integer
          format: int64
          minimum: 1
        fromStartedAtMs:
          type: integer
          format: int64
          minimum: 0
        toEndedAtMs:
          type: integer
          format: int64
          minimum: 0
        rawDeltaSaturated:
          type: boolean
          description: raw delta가 상한에 닿아 추가 항목이 있을 수 있다. 추가 항목이 반드시 있다는 뜻은 아니다.
        semanticUnitSaturated:
          type: boolean
          description: semantic unit 7개 상한 또는 limit drop으로 추가 항목이 있을 수 있다. 추가 항목이 반드시 있다는 뜻은 아니다.
        appliedAt:
          type: string
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
    AppErrorDetail:
      type: object
      required:
      - field
      - message
      properties:
        field:
          type: string
          example: name
          description: 오류가 발생한 필드
          nullable: false
        message:
          type: string
          example: 이름은 필수입니다.
          description: 필드 오류 메시지
          nullable: false
      title: AppErrorDetail
    AppError:
      type: object
      required:
      - code
      - message
      - details
      properties:
        code:
          type: string
          example: WORKSPACE_NOT_FOUND
          description: 애플리케이션 오류 코드
          nullable: false
        message:
          type: string
          example: 워크스페이스를 찾을 수 없습니다.
          description: 사용자에게 표시할 오류 메시지
          nullable: false
        details:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/AppErrorDetail'
          description: 필드별 오류 상세
      description: 오류 정보
      title: AppError
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: 로그인 후 발급되는 HttpOnly access token 쿠키
  responses:
    Unauthorized:
      description: 인증 필요
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppErrorResponse'
          examples:
            UNAUTHORIZED:
              value:
                success: false
                data: null
                error:
                  code: UNAUTHORIZED
                  message: 인증이 필요합니다.
                  details: null
