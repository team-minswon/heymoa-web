          pattern: ^[0-9A-HJKMNP-TV-Z]{13}$
          minLength: 13
          maxLength: 13
        example: 0HZX2K7M9Q4AF
      - name: label
        in: path
        description: ''
        required: true
        schema:
          type: string
          description: 정규화된 화자 라벨
          nullable: false
          pattern: ^[A-Z0-9]{1,8}$
