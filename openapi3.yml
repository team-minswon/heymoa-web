  /v1/agent-chats/{chatId}/turns/{turnId}/events:
    get:
      tags:
      - AgentChat
      summary: 턴 스트림 (SSE)
      description: '턴 하나의 프레임을 나르는 SSE. POST /messages 나 POST …/resolve 의 202 가 준 turnId 로 붙는다. after 보다 뒤의 프레임부터 순서대로 오고 id 줄이 entry id 다 — 재접속할 때 마지막으로 본 id 를 after 로 돌려준다. Last-Event-ID 헤더도 같은 뜻이고 둘 다 있으면 after 다. 종료 프레임(message_end · turn_failed · turn_cancelled · tool_approval_request) 뒤에 닫힌다. error 는 닫지 않고 뒤따르는 turn_failed 에서 닫는다. 하트비트는 주석 `: keepalive` 10초, 절대 상한 30분. 턴이 아직 안 시작해 스트림이 없어도 200 으로 열고 기다린다. 턴은 끝났는데 스트림이 TTL 로 사라졌으면 410 — GET /messages 를 다시 읽는다. 이벤트 계약은 asyncapi-web-server.yml.'
      operationId: subscribeAgentChatTurnEvents
      parameters:
      - name: chatId
        in: path
        description: 채팅 세션의 13자리 TSID
        required: true
        schema:
          type: string
          description: 채팅 세션의 13자리 TSID
          nullable: false
          pattern: ^[0-9A-HJKMNP-TV-Z]{13}$
          minLength: 13
          maxLength: 13
        example: 0K9GVJT2C4Q2A
      - name: turnId
        in: path
        description: 턴의 13자리 TSID
        required: true
        schema:
          type: string
          description: 턴의 13자리 TSID
          nullable: false
          pattern: ^[0-9A-HJKMNP-TV-Z]{13}$
          minLength: 13
          maxLength: 13
        example: 0K9GVJT2C4Q3B
      - name: after
        in: query
        description: 여기까지는 이미 안다. 재접속이면 마지막으로 받은 id, 새로고침이면 GET /messages 의 cursor. 생략하면 처음부터. 불투명한 문자열이라 크기 비교를 하지 않는다
        required: false
        schema:
          type: string
          description: 여기까지는 이미 안다. 재접속이면 마지막으로 받은 id, 새로고침이면 GET /messages 의 cursor. 생략하면 처음부터. 불투명한 문자열이라 크기 비교를 하지 않는다
          nullable: false
        example: 1735689600000-0
      - name: Last-Event-ID
        in: header
        description: after 와 같은 뜻. 둘 다 있으면 after 가 이긴다
        required: false
        schema:
          type: string
        example: 1735689600000-0
      responses:
        '410':
          description: '410'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              examples:
                AGENT_CHAT_STREAM_GONE:
                  value:
                    success: false
                    data: null
                    error:
                      code: AGENT_CHAT_STREAM_GONE
                      message: 스트림이 사라졌습니다. 히스토리를 다시 읽어 주세요.
                      details: null
        '404':
          description: 요청한 리소스를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              examples:
                AGENT_CHAT_NOT_FOUND:
                  value:
                    success: false
                    data: null
                    error:
                      code: AGENT_CHAT_NOT_FOUND
                      message: 채팅 세션을 찾을 수 없습니다.
                      details: null
                AGENT_CHAT_TURN_NOT_FOUND:
                  value:
                    success: false
                    data: null
                    error:
                      code: AGENT_CHAT_TURN_NOT_FOUND
                      message: 요청한 턴을 찾을 수 없습니다.
                      details: null
        '200':
          description: 요청 성공
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 이벤트 스트림. 이벤트별 payload는 AsyncAPI 계약을 따른다.
              examples:
                subscribeAgentChatTurnEvents_Success:
                  value: 'id:1735689600001-0

                    event:token

                    data:{"delta":"안"}


                    id:1735689600002-0

                    event:message_end

                    data:{"messageId":"m1","content":"안녕하세요"}


                    '
        '503':
          description: '503'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              examples:
                AGENT_CHAT_CAPACITY_EXCEEDED:
                  value:
                    success: false
                    data: null
                    error:
                      code: AGENT_CHAT_CAPACITY_EXCEEDED
                      message: 지금은 연결이 많아 스트림을 열 수 없습니다.
                      details: null
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - accessCookie: []
