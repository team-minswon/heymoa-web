    NoteSummary:
      title: "NoteSummary"
      description: "회의 요약. 목록·단건·워크스페이스 전역 목록이 함께 쓴다."
      required:
      - "analysisStatus"
      - "participants"
      - "previousNote"
      - "scheduledAt"
      - "activeSessionStartedAt"
      - "createdAt"
      - "lastRecordedAt"
      - "meetingStartedAt"
      - "meetingStartedBy"
      - "meetingStatus"
      - "noteId"
      - "projectId"
      - "recordedDurationMs"
      - "title"
      - "updatedAt"
      type: "object"
      properties:
        scheduledAt:
          type: "string"
          description: "예정 일시. null 이면 일시 미정"
          nullable: true
          example: "2026-08-05T05:00:00Z"
          format: "date-time"
        participants:
          type: "array"
          description: "참석자. 워크스페이스 멤버 중에서 고른다. 공유 범위와는 다른 개념이다\
            \ — 회의록은 멤버 전원이 보고 참석자는 「누가 있었나」다"
          nullable: false
          maxItems: 50
          items:
            required:
            - "name"
            - "userId"
            type: "object"
            properties:
              userId:
                type: "string"
                nullable: false
                example: "0HZX2K7M9Q4AC"
                pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
                minLength: 13
                maxLength: 13
              name:
                type: "string"
                nullable: false
                example: "홍길동"
              email:
                type: "string"
                description: "아바타 hover 툴팁이 쓴다"
                nullable: true
                example: "hong@heymoa.com"
                format: "email"
        analysisStatus:
          type: "string"
          description: "최신 분석 잡 상태. 한 번도 안 돌렸으면 NONE. meetingStatus 와 직교한다\
            \ — 배지가 「종료됨 + 분석 중」으로 나란히 붙는다"
          nullable: false
          example: "NONE"
          enum:
          - "NONE"
          - "PENDING"
          - "RUNNING"
          - "SUCCEEDED"
          - "FAILED"
        previousNote:
          type: "object"
          description: "이 회의가 후속인 원 회의. 트리가 아니라 사슬이라 하나뿐이다"
          nullable: true
          required:
          - "noteId"
          - "title"
          properties:
            noteId:
              type: "string"
              nullable: false
              example: "0HZX2K7M9Q4AG"
              pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
              minLength: 13
              maxLength: 13
            title:
              type: "string"
              nullable: false
              example: "3분기 로드맵 초안"
        meetingStartedAt:
          type: "string"
          description: "최초 ACTIVE 전사 세션의 시작 시각 (한 번도 ACTIVE가 아니면 null)"
          nullable: true
          example: "2026-07-14T01:02:03Z"
          format: "date-time"
        createdAt:
          type: "string"
          description: "노트 생성 시각"
          nullable: false
          example: "2026-07-14T01:02:03Z"
          format: "date-time"
        lastRecordedAt:
          type: "string"
          description: "가장 최근 종료된 전사 세션의 시작 시각"
          nullable: true
          example: "2026-07-14T01:02:03Z"
          format: "date-time"
        meetingStartedBy:
          type: "object"
          properties:
            name:
              type: "string"
              description: "회의 시작자 이름"
              nullable: false
              example: "홍길동"
            userId:
              type: "string"
              description: "회의 시작자의 13자리 TSID"
              nullable: false
              example: "0HZX2K7M9Q4AC"
              pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
              minLength: 13
              maxLength: 13
          description: "회의 시작자 (녹음을 최초로 시작한 유저, 녹음 전이면 null)"
          nullable: true
          required:
          - "userId"
          - "name"
        recordedDurationMs:
          type: "integer"
          description: "ACTIVE였고 종료된 COMPLETED/INTERRUPTED 세션의 startedAt~endedAt\
            \ 구간만 합산한 누적 녹음 시간(ms), READY 중단과 진행 중 구간은 0"
          nullable: false
          example: 6500
          format: "int64"
          minimum: 0
        meetingStatus:
          type: "string"
          description: "회의 상태"
          nullable: false
          example: "IN_PROGRESS"
          enum:
          - "NOT_STARTED"
          - "IN_PROGRESS"
          - "PAUSED"
          - "ENDED"
        noteId:
          type: "string"
          description: "노트의 13자리 TSID"
          nullable: false
          example: "0HZX2K7M9Q4AF"
          pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
          minLength: 13
          maxLength: 13
        title:
          type: "string"
          description: "노트 제목"
          nullable: false
          example: "주간 회의"
          maxLength: 200
        projectId:
          type: "string"
          description: "프로젝트의 13자리 TSID"
          nullable: false
          example: "0HZX2K7M9Q4AE"
          pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
          minLength: 13
          maxLength: 13
        activeSessionStartedAt:
          type: "string"
          description: "현재 ACTIVE 전사 세션의 시작 시각 (READY 또는 활성 세션이 없으면 null)"
          nullable: true
          example: "2026-07-14T01:02:03Z"
          format: "date-time"
        updatedAt:
          type: "string"
          description: "노트 수정 시각"
          nullable: false
          example: "2026-07-14T01:02:03Z"
          format: "date-time"
    NotePageResponse:
      title: "NotePageResponse"
      description: "커서 페이지네이션을 쓰는 회의 목록. 기존 NoteListResponse 는 커서가 없어\
        \ 새 스키마로 뺐다 — 목록 응답이 두 종류가 된다."
      required:
      - "data"
      - "error"
      - "success"
      type: "object"
      properties:
        data:
          required:
          - "nextCursor"
          - "notes"
          type: "object"
          properties:
            notes:
              type: "array"
              nullable: false
              items:
                $ref: "#/components/schemas/NoteSummary"
            nextCursor:
              type: "string"
              description: "다음 페이지 커서. 마지막 페이지면 null"
              nullable: true
              example: "eyJ1IjoiMjAyNi0wNy0xNCJ9"
          description: "성공 응답 데이터"
          nullable: false
        success:
          type: "boolean"
          nullable: false
          example: true
        error:
          nullable: true
          enum:
          - null
          description: "성공 시 null인 오류 정보"
    NoteCreateRequest:
      title: "NoteCreateRequest"
      required:
      - "title"
      type: "object"
      properties:
        title:
          type: "string"
          nullable: false
          example: "주간 회의"
          minLength: 1
          maxLength: 200
        projectId:
          type: "string"
          description: "워크스페이스 스코프 생성에서만 의미가 있다. null 이면 기본 프로젝트"
          nullable: true
          example: "0HZX2K7M9Q4AE"
          pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
        scheduledAt:
          type: "string"
          description: "예정 일시. null 이면 일시 미정"
          nullable: true
          example: "2026-08-05T05:00:00Z"
          format: "date-time"
        participantIds:
          type: "array"
          nullable: true
          maxItems: 50
          items:
            type: "string"
            pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
        context:
          type: "string"
          nullable: true
          maxLength: 2000
        contextFromNoteIds:
          type: "array"
          description: "지난 회의에서 맥락을 이어받는다. 서버가 요약해 context 초안을 만든다.\
            \ 첫 항목이 previousNoteId 의 기본값이 된다"
          nullable: true
          maxItems: 5
          items:
            type: "string"
            pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
        previousNoteId:
          type: "string"
          description: "이 회의가 후속인 원 회의. 같은 프로젝트여야 하고 순환은 거부한다"
          nullable: true
          example: "0HZX2K7M9Q4AG"
          pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
    NoteUpdateRequest:
      title: "NoteUpdateRequest"
      description: "부분 수정. 키가 없으면 그대로 두고, 키가 있고 값이 null 이면 지운다 —\
        \ 이 구분이 없으면 「일시 미정으로 되돌리기」를 표현할 수 없다."
      type: "object"
      properties:
        title:
          type: "string"
          nullable: false
          example: "주간 회의"
          minLength: 1
          maxLength: 200
        projectId:
          type: "string"
          description: "회의 이동"
          nullable: false
          example: "0HZX2K7M9Q4AE"
          pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
        scheduledAt:
          type: "string"
          nullable: true
          example: "2026-08-05T05:00:00Z"
          format: "date-time"
        participantIds:
          type: "array"
          nullable: true
          maxItems: 50
          items:
            type: "string"
            pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
        context:
          type: "string"
          nullable: true
          maxLength: 2000
        previousNoteId:
          type: "string"
          nullable: true
          example: "0HZX2K7M9Q4AG"
          pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
    ActionItem:
      title: "ActionItem"
      description: "회의 분석에서 나온 할 일. AnalysisResultResponse.actionItems(마크다운\
        \ 문자열)와 함께 존재한다 — 그쪽은 요약 탭이 계속 쓰고, 이쪽은 회의를 가로지르는 뷰를 위한 것이다.\
        \ 이 리소스가 생기려면 heymoa-ai 의 분석 출력이 구조화돼야 한다."
      required:
      - "actionItemId"
      - "assignee"
      - "createdAt"
      - "dueAt"
      - "noteId"
      - "noteTitle"
      - "projectId"
      - "status"
      - "text"
      type: "object"
      properties:
        actionItemId:
          type: "string"
          nullable: false
          example: "0K9GVJT2C4Q20"
          pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
          minLength: 13
          maxLength: 13
        noteId:
          type: "string"
          nullable: false
          example: "0HZX2K7M9Q4AF"
          pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
        noteTitle:
          type: "string"
          description: "출처 회의 제목. 목록이 회의를 가로지르므로 N+1 을 피하려고 같이 내린다"
          nullable: false
          example: "3분기 로드맵 초안"
        projectId:
          type: "string"
          nullable: false
          example: "0HZX2K7M9Q4AE"
          pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
        text:
          type: "string"
          nullable: false
          example: "결제 개편 착수 시점 확정"
          maxLength: 500
        assignee:
          type: "object"
          description: "담당자. 분석이 못 고르면 null 이고 화면은 「미지정」으로 그린다"
          nullable: true
          required:
          - "name"
          - "userId"
          properties:
            userId:
              type: "string"
              nullable: false
              example: "0HZX2K7M9Q4AC"
              pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
            name:
              type: "string"
              nullable: false
              example: "김서연"
        dueAt:
          type: "string"
          description: "기한. null 이면 기한 없음"
          nullable: true
          example: "2026-08-01T00:00:00Z"
          format: "date-time"
        status:
          type: "string"
          nullable: false
          example: "OPEN"
          enum:
          - "OPEN"
          - "DONE"
        createdAt:
          type: "string"
          nullable: false
          example: "2026-07-24T01:02:03Z"
          format: "date-time"
    ActionItemPageResponse:
      title: "ActionItemPageResponse"
