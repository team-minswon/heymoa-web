    NoteSharedChatResponse:
      title: "NoteSharedChatResponse"
      required:
      - "data"
      - "error"
      - "success"
      type: "object"
      properties:
        data:
          required:
          - "chatId"
          - "lock"
          - "messages"
          type: "object"
          properties:
            chatId:
              type: "string"
              description: "공유 챗봇 세션의 13자리 TSID (승인 API 등에서 사용)"
              nullable: false
              example: "0K9GVJT2C4Q2A"
              pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
              minLength: 13
              maxLength: 13
            messages:
              type: "array"
              description: "표시용 메시지 목록 (시간순, 없으면 빈 배열)"
              items:
                required:
                - "content"
                - "createdAt"
                - "messageId"
                - "role"
                - "authorName"
                - "toolEvent"
                type: "object"
                properties:
                  createdAt:
                    type: "string"
                    description: "메시지 시각"
                    nullable: false
                    example: "2026-07-14T01:02:03Z"
                    format: "date-time"
                  role:
                    type: "string"
                    description: "메시지 역할"
                    nullable: false
                    example: "USER"
                    enum:
                    - "USER"
                    - "ASSISTANT"
                    - "TOOL"
                  toolEvent:
                    type: "object"
                    properties:
                      decision:
                        type: "string"
                        description: "승인 확정 기록이면 결정, 실행 결과 기록이면 null"
                        nullable: true
                        example: "APPROVED"
                        enum:
                        - "APPROVED"
                        - "REJECTED"
                      url:
                        type: "string"
                        description: "생성된 외부 리소스 링크 (없으면 null)"
                        nullable: true
                        example: "https://linear.app/heymoa/issue/APP-123"
                      tool:
                        type: "string"
                        description: "도구 이름"
                        nullable: false
                        example: "linear.create_issue"
                      status:
                        type: "string"
                        description: "실행 결과 기록이면 상태, 승인 확정 기록이면 null"
                        nullable: true
                        example: "success"
                        enum:
                        - "success"
                        - "error"
                    description: "role=TOOL일 때만 값이 있는 구조화된 승인/도구 실행 기록 (그 외 null)"
                    nullable: true
                    required:
                    - "tool"
                    - "decision"
                    - "status"
                    - "url"
                  authorName:
                    type: "string"
                    description: "USER 메시지의 작성자 표시 이름 (ASSISTANT/TOOL은 null)"
                    nullable: true
                    example: "홍길동"
                  messageId:
                    type: "string"
                    description: "메시지의 13자리 TSID"
                    nullable: false
                    example: "0K9GVJT2C4Q3B"
                    pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
                    minLength: 13
                    maxLength: 13
                  content:
                    type: "string"
                    description: "메시지 내용 (TOOL이면 표시용 요약)"
                    nullable: false
                    example: "방금 논의한 배포 이슈 요약해줘"
              nullable: false
            lock:
              required:
              - "locked"
              - "lockedBy"
              - "pendingApproval"
              type: "object"
              properties:
                lockedBy:
                  type: "string"
                  description: "입력 중인 멤버 표시 이름 (잠금이 없으면 null)"
                  nullable: true
                  example: "홍길동"
                locked:
                  type: "boolean"
                  description: "현재 다른 멤버가 입력 중인지 여부 (만료된 잠금은 false)"
                  nullable: false
                  example: true
                pendingApproval:
                  required:
                  - "approvalId"
                  - "tool"
                  - "summary"
                  type: "object"
                  properties:
                    summary:
                      type: "string"
                      description: "도구 실행 요약 (AI가 제공하지 않으면 null)"
                      nullable: true
                      example: "Linear 이슈 생성"
                    approvalId:
                      type: "string"
                      description: "승인 요청의 13자 TSID (heymoa-ai 발급) — 승인 API 경로에 사용"
                      nullable: false
                      example: "0K9GVJT2C4Q7F"
                      pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
                      minLength: 13
                      maxLength: 13
                    tool:
                      type: "string"
                      description: "승인 대기 중인 도구 이름"
                      nullable: false
                      example: "linear.create_issue"
                  description: "승인 대기 중이면 관전자 표시용 정보 (대기가 없으면 null) — 관전자 폴링 대상"
                  nullable: true
              description: "입력 잠금 상태"
              nullable: false
          description: "성공 응답 데이터"
          nullable: false
        success:
          type: "boolean"
          description: "요청 성공 여부"
          nullable: false
          example: true
        error:
          nullable: true
          enum:
          - null
          description: "성공 시 null인 오류 정보"
