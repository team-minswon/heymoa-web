# heymoa-server 빌드 산출물의 public 미러. 출처는 docs repo의 `INDEX.md`가
# 가리키는 server public contract다.
# 손으로 수정하지 말 것. 갱신: docs repo에서 복사한 뒤 /internal/** 경로를 제거.
#
# **생성은 반드시 clean과 함께다.** `./gradlew clean openapi3` — clean 없이 돌리면
# build/generated-snippets/의 옛 스니펫을 전부 긁어모아 삭제된 API가 부활한다.
# 실제로 APP-214에서 meeting-pause·meeting-resume가 되살아나 37경로가 나왔다(정상 35).
#
# /internal/** 3경로(callbacks/analyses, notes/{noteId}/context,
# workspaces/{workspaceId}/notes)는 heymoa-ai가 호출하는 경로라 web에서 제외한다 —
# 남기면 브라우저가 부르지 않는 훅과 MSW 목이 생긴다. internalToken 보안 스킴도
# 참조하는 경로가 사라져 함께 제거했다. 그 경로 전용 스키마와 그 전이 의존성도 같이 뺀다 —
# 남기면 아무도 안 쓰는 모델이 생성된다.
# ⚠️ MVP2 — 아래 구간은 손으로 더했고 heymoa-server 에 아직 없다.
# rules/api-data.md 는 이 파일을 손으로 고치지 말라고 하지만, MVP2 는 화면이 계약보다
# 앞서는 기획 단계라 사용자 결정으로 예외를 뒀다. 서버가 따라온 뒤 재생성하면
# 아래 목록을 다시 넣어야 한다 — 무엇을 왜 더했는지는 design/CONTRACT-SPEC-DELTA.md 에 있다.
#
#   스키마  NoteSummary(추출) · NotePageResponse · NoteCreateRequest · NoteUpdateRequest
#           ActionItem · ActionItemPageResponse · ActionItemUpdateRequest · ActionItemResponse
#   필드    NoteSummary.scheduledAt · participants · analysisStatus · previousNote
#           NoteResponse.data.context · ProjectListResponse.items[].isDefault
#   경로    GET/POST /v1/workspaces/{workspaceId}/notes
#           DELETE   /v1/notes/{noteId}
#           PUT      /v1/notifications/read-all
#           GET      /v1/workspaces/{workspaceId}/action-items
#           PATCH    /v1/action-items/{actionItemId}
#   파라미터 GET /v1/projects/{projectId}/notes 에 from·to·sort·cursor·limit
---
openapi: "3.0.1"
info:
  title: "Heymoa API"
  description: "Heymoa 서버 REST API"
  version: "1.0.0"
servers:
- url: "/"
tags: []
paths:
  /v1/agent-chats:
    post:
      tags:
      - "AgentChat"
      summary: "채팅 세션 생성"
      description: "연결할 노트에 접근할 수 없으면 404로 응답한다."
      operationId: "createAgentChat"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentChatV2Request"
            examples:
              createAgentChat_NoteNotFoundException:
                value:
                  scope: "note"
                  noteId: "0HZX2K7M9Q4AF"
                  title: "회의 후속"
              createAgentChat_WorkspaceNotFoundException:
                value:
                  scope: "workspace"
                  workspaceId: "0HZX2K7M9Q4AD"
                  title: "워크스페이스 질문"
              createAgentChat_Success:
                value:
                  scope: "note"
                  noteId: "0HZX2K7M9Q4AF"
                  title: "회의 후속"
              createAgentChat_ProjectNotFoundException:
                value:
                  scope: "note"
                  noteId: "0HZX2K7M9Q4AF"
                  title: "회의 후속"
              createAgentChat_BadRequest:
                value:
                  scope: "workspace"
                  title: "워크스페이스 질문"
      responses:
        "404":
          description: "요청한 리소스를 찾을 수 없음"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppErrorResponse"
              examples:
                NOTE_NOT_FOUND:
                  value:
                    success: false
                    data: null
                    error:
                      code: "NOTE_NOT_FOUND"
                      message: "노트를 찾을 수 없습니다."
                      details: null
                WORKSPACE_NOT_FOUND:
                  value:
                    success: false
                    data: null
                    error:
                      code: "WORKSPACE_NOT_FOUND"
                      message: "워크스페이스를 찾을 수 없습니다."
                      details: null
                PROJECT_NOT_FOUND:
                  value:
                    success: false
                    data: null
                    error:
                      code: "PROJECT_NOT_FOUND"
                      message: "프로젝트를 찾을 수 없습니다."
                      details: null
        "201":
          description: "생성 성공"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentChatV2Response"
              examples:
                SUCCESS:
                  value:
                    success: true
                    data:
                      chatId: "0K9GVJT2C4Q2A"
                      scope: "note"
                      workspaceId: null
                      noteId: "0HZX2K7M9Q4AF"
                      title: "회의 후속"
                      createdAt: "2026-07-22T00:00:00Z"
                    error: null
        "400":
          description: "잘못된 요청"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppErrorResponse"
              examples:
                BAD_REQUEST:
                  value:
                    success: false
                    data: null
                    error:
                      code: "BAD_REQUEST"
                      message: "잘못된 요청입니다."
                      details: null
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
      - accessCookie: []
