              items:
                $ref: "#/components/schemas/ActionItem"
            nextCursor:
              type: "string"
              nullable: true
              example: "eyJ1IjoiMjAyNi0wNy0xNCJ9"
          description: "성공 응답 데이터"
          nullable: false
        success:
          type: "boolean"
          nullable: false
          example: true
        error:
          nullable: true
          enum:
          - null
          description: "성공 시 null인 오류 정보"
    ActionItemResponse:
