components:
  schemas:
    StartTranscriptionSessionResponse:
      title: "StartTranscriptionSessionResponse"
      required:
      - "data"
      - "error"
      - "success"
      type: "object"
      properties:
        data:
          required:
          - "endReason"
          - "endedAt"
          - "noteId"
          - "readyExpiresAt"
          - "sessionId"
          - "startedAt"
          - "status"
          type: "object"
          properties:
            readyExpiresAt:
              type: "string"
              description: "전사 연결 대기 만료 시각"
              nullable: false
              example: "2026-07-14T01:02:03Z"
              format: "date-time"
            noteId:
              type: "string"
              description: "노트의 13자리 TSID"
              nullable: false
              example: "0HZX2K7M9Q4AF"
              pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
              minLength: 13
              maxLength: 13
            sessionId:
              type: "string"
              description: "전사 세션의 13자리 TSID"
              nullable: false
              example: "0HZX2K7M9Q4AG"
              pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
              minLength: 13
              maxLength: 13
            status:
              type: "string"
              description: "전사 세션 상태"
              nullable: false
              example: "READY"
              enum:
              - "READY"
              - "ACTIVE"
              - "COMPLETED"
              - "INTERRUPTED"
            startedAt:
              type: "string"
              description: "전사 시작 시각 (READY면 null)"
              nullable: true
              example: "2026-07-14T01:02:03Z"
              format: "date-time"
            endedAt:
              type: "string"
              description: "전사 종료 시각 (READY면 null)"
              nullable: true
              example: "2026-07-14T01:02:03Z"
              format: "date-time"
            endReason:
              type: "string"
              description: "전사 종료 사유 (READY면 null)"
              nullable: true
              example: "CLIENT_DISCONNECTED"
              enum:
              - "READY_TIMEOUT"
              - "CLIENT_DISCONNECTED"
              - "CLIENT_PROTOCOL_ERROR"
              - "STT_PROVIDER_ERROR"
              - "INTERNAL_ERROR"
              - "MEETING_ENDED"
              - "MEETING_PAUSED"
          description: "성공 응답 데이터"
          nullable: false
        success:
          type: "boolean"
          description: "요청 성공 여부"
          nullable: false
          example: true
        error:
          nullable: true
          enum:
          - null
          description: "성공 시 null인 오류 정보"
    AgentChatV2NullableResponse:
      title: "AgentChatV2NullableResponse"
      required:
      - "error"
      - "success"
      - "data"
      type: "object"
      properties:
        data:
          required:
          - "chatId"
          - "createdAt"
          - "scope"
          type: "object"
          properties:
            createdAt:
              type: "string"
              description: "생성 시각"
              nullable: false
              example: "2026-07-14T01:02:03Z"
              format: "date-time"
            chatId:
              type: "string"
              description: "채팅 세션의 13자리 TSID"
              nullable: false
              example: "0K9GVJT2C4Q2A"
              pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
              minLength: 13
              maxLength: 13
            scope:
              type: "string"
              description: "컨텍스트 범위"
              nullable: false
              example: "workspace"
              enum:
              - "workspace"
              - "note"
            noteId:
              type: "string"
              description: "연결된 노트 (scope=workspace면 null)"
              nullable: true
              example: "0HZX2K7M9Q4AF"
              pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
              minLength: 13
              maxLength: 13
            title:
              type: "string"
              description: "대화 제목"
              nullable: true
              example: "워크스페이스 질문"
            workspaceId:
              type: "string"
              description: "연결된 워크스페이스 (scope=note면 null)"
              nullable: true
              example: "0HZX2K7M9Q4AD"
              pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
              minLength: 13
              maxLength: 13
          description: "성공 응답 데이터"
          nullable: true
        success:
          type: "boolean"
          description: "요청 성공 여부"
          nullable: false
          example: true
        error:
          nullable: true
          enum:
          - null
          description: "성공 시 null인 오류 정보"
    SendAgentChatMessageRequest:
      title: "SendAgentChatMessageRequest"
      required:
      - "message"
      type: "object"
      properties:
        message:
          type: "string"
          description: "유저 메시지 (공백만으로 구성 불가)"
          nullable: false
          example: "안녕"
          pattern: "[\\s\\S]*\\S[\\s\\S]*"
          minLength: 1
    TranscriptResponse:
      title: "TranscriptResponse"
      required:
      - "data"
      - "error"
      - "success"
      type: "object"
      properties:
        data:
          required:
          - "diarization"
          - "gaps"
          - "recording"
          - "segments"
          type: "object"
          properties:
            recording:
              required:
              - "audioRetained"
              - "durationMs"
              - "seal"
              - "startedAt"
              type: "object"
              properties:
                seal:
                  type: "string"
                  description: "봉인 판정. OPEN 은 오류가 아니라 아직 판정 전이다"
                  nullable: false
                  example: "COMPLETE"
                startedAt:
                  type: "string"
                  description: "회의 축의 원점이 되는 실제 시각"
                  nullable: false
                  format: "date-time"
                audioRetained:
                  type: "boolean"
                  description: "false 면 소리가 남지 않아 화자 분리를 못 한다"
                  nullable: false
                durationMs:
                  type: "integer"
                  description: "회의 축 길이. OPEN 이면 지금까지"
                  nullable: false
                  example: 1820000
                  format: "int64"
                  minimum: 0
              description: "회의 축의 원점과 봉인 상태"
              nullable: false
            diarization:
              required:
              - "speakers"
              - "status"
              type: "object"
              properties:
                speakers:
                  type: "array"
                  description: "MAPPED 이전에는 빈 배열. 말한 양 내림차순"
                  items:
                    required:
                    - "confirmed"
                    - "label"
                    - "representativeSegmentId"
                    - "segmentCount"
                    - "speakingMs"
                    - "assignedUserId"
                    - "assignedName"
                    type: "object"
                    properties:
                      speakingMs:
                        type: "integer"
                        description: "이 화자의 turn 길이 합"
                        nullable: false
                        example: 940000
                        format: "int64"
                        minimum: 0
                      assignedName:
                        type: "string"
                        description: "연결된 참석자 이름"
                        nullable: true
                        example: "홍길동"
