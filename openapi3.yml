      tags:
      - AgentChat
      summary: 턴 중지
      description: 도는 턴을 세운다. **멱등이다** — 이미 끝난 턴에 눌러도 204다. 그때까지 흘린 token 을 이어 붙인 부분 답이 히스토리에 남고, 붙어 있던 스트림은 turn_cancelled 로 닫힌다. 소유권 판정이 턴 판정보다 먼저라 없거나 소유하지 않은 대화는 404로 끝나 남의 턴 존재가 새지 않고, 그 대화에 그 턴이 없으면 **대화 없음(AGENT_CHAT_NOT_FOUND)으로 접지 않은** 별도 404다.
      operationId: cancelAgentChatTurn
      parameters:
