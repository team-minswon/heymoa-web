      description: 라벨은 맞는데 그 줄 하나만 남의 말로 붙은 경우를 고친다. 라벨 전체를 옮기는 PUT /v1/notes/{noteId}/speakers/{label} 과 짝이고, 권한도 대상 규칙도 같다. 대상이 없으면 개별 지정을 해제한다 - 그 발화는 다시 라벨의 지정을 따른다. 라벨 지정의 null(「참석자 중에 없다」)과 뜻이 다르다. 응답은 그 발화 한 줄이다 - 딸려 바뀌는 화자가 없다.
      operationId: assignSegmentSpeaker
      parameters:
      - name: noteId
        in: path
        description: ''
        required: true
        schema:
          type: string
          description: 노트의 13자리 TSID
          nullable: false
          pattern: ^[0-9A-HJKMNP-TV-Z]{13}$
          minLength: 13
          maxLength: 13
        example: 0HZX2K7M9Q4AF
      - name: segmentId
        in: path
        description: ''
        required: true
        schema:
          type: string
          description: 발화의 13자리 TSID
          nullable: false
          pattern: ^[0-9A-HJKMNP-TV-Z]{13}$
          minLength: 13
          maxLength: 13
        example: 0HZX2K7M9Q4AH
      requestBody:
        content:
