  /v1/workspaces/{workspaceId}/guests/{guestId}/link:
    post:
      tags:
      - Workspaces
      summary: 임시 참여자와 계정 연동
      description: 임시 참여자를 워크스페이스 멤버 한 명과 잇는다. **되돌릴 수 없다** - 그 사람이 나온 모든 회의록의 참여 기록이 그 계정 것이 되고, 참여 기록 식별자를 유지하므로 화자 연결은 풀리지 않는다. **건너뛰는 회의가 없다** - 그 계정이 같은 회의에서 이미 다른 화자에 붙어 있어도 두 화자를 그대로 들고 합친다. 한 사람이 여러 화자를 맡을 수 있게 되면서 사람이 판단할 것이 없어졌다. ADMIN만 부를 수 있고, 실행하면 임시 참여자 자체가 사라진다.
      operationId: linkWorkspaceGuest
      parameters:
      - name: workspaceId
        in: path
        description: 워크스페이스의 13자리 TSID
        required: true
        schema:
          type: string
          description: 워크스페이스의 13자리 TSID
          nullable: false
          pattern: ^[0-9A-HJKMNP-TV-Z]{13}$
          minLength: 13
          maxLength: 13
        example: 0HZX2K7M9Q4AD
      - name: guestId
        in: path
        description: 임시 참여자의 13자리 TSID
        required: true
        schema:
          type: string
          description: 임시 참여자의 13자리 TSID
          nullable: false
          pattern: ^[0-9A-HJKMNP-TV-Z]{13}$
          minLength: 13
          maxLength: 13
        example: 0HZX2K7M9Q4AR
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkWorkspaceGuestRequest'
            examples:
              linkWorkspaceGuest_WorkspaceAccessDeniedException:
                value:
                  targetUserId: 0HZX2K7M9Q4AM
              linkWorkspaceGuest_ConcurrentGuestLinkException:
                value:
                  targetUserId: 0HZX2K7M9Q4AM
              linkWorkspaceGuest_WorkspaceMemberNotFoundException:
                value:
                  targetUserId: 0HZX2K7M9Q4AM
              linkWorkspaceGuest_WorkspaceGuestNotFoundException:
                value:
                  targetUserId: 0HZX2K7M9Q4AM
              linkWorkspaceGuest_Success:
                value:
                  targetUserId: 0HZX2K7M9Q4AM
      responses:
        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              examples:
                WORKSPACE_ACCESS_DENIED:
                  value:
                    success: false
                    data: null
                    error:
                      code: WORKSPACE_ACCESS_DENIED
                      message: 워크스페이스를 변경할 권한이 없습니다.
                      details: null
        '409':
          description: 요청 상태 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              examples:
                CONCURRENT_GUEST_LINK:
                  value:
                    success: false
                    data: null
                    error:
                      code: CONCURRENT_GUEST_LINK
                      message: 연동 중에 회의가 바뀌었습니다. 다시 시도해 주세요.
                      details: null
        '404':
          description: 요청한 리소스를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppErrorResponse'
              examples:
                WORKSPACE_MEMBER_NOT_FOUND:
                  value:
                    success: false
                    data: null
                    error:
                      code: WORKSPACE_MEMBER_NOT_FOUND
                      message: 워크스페이스 멤버를 찾을 수 없습니다.
                      details: null
                WORKSPACE_GUEST_NOT_FOUND:
                  value:
                    success: false
                    data: null
                    error:
                      code: WORKSPACE_GUEST_NOT_FOUND
                      message: 임시 참여자를 찾을 수 없습니다.
                      details: null
        '200':
          description: 요청 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestLinkResponse'
              examples:
                SUCCESS:
                  value:
                    success: true
                    data:
                      changedNoteCount: 4
                      changedNotes:
                      - noteId: 0HZX2K7M9Q4AF
                        title: 주간 회의
                    error: null
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - accessCookie: []
