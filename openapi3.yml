      description: 화자 연결은 노트의 속성이 아니라 화자 라벨의 속성이다. **노트에 닿는 워크스페이스 멤버면 누구나 고친다** - 회의록을 정리하는 사람이 그 회의에 안 들어간 경우가 흔하다. 대상을 가리키는 열쇠가 셋이고 뜻이 다르다 - participantId 는 이 회의의 참여 기록(임시 참여자와 나간 사람 포함), userId 와 guestId 는 각각 계정과 임시 참여자이고 **참여자가 아니면 참여자로 넣는다**. 둘 이상을 함께 보내면 거절한다. 응답은 갱신된 화자 목록 전체다. 이 화자에 달린 발화 단위 지정은 함께 지워진다 - 「모든 발화에 적용」이 말 그대로가 되도록.
