      properties:
        data:
          required:
          - "endReason"
          - "endedAt"
          - "noteId"
          - "readyExpiresAt"
          - "sessionId"
          - "startedAt"
          - "status"
          type: "object"
          properties:
            readyExpiresAt:
              type: "string"
              description: "전사 연결 대기 만료 시각"
              nullable: false
              example: "2026-07-14T01:02:03Z"
              format: "date-time"
            noteId:
              type: "string"
              description: "노트의 13자리 TSID"
              nullable: false
              example: "0HZX2K7M9Q4AF"
              pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
              minLength: 13
              maxLength: 13
            sessionId:
              type: "string"
