  /v1/integrations/{provider}/callback:
    get:
      tags:
      - WorkspaceIntegration
      summary: 워크스페이스 연동 콜백
      description: provider OAuth 콜백을 처리하고 웹으로 리다이렉트한다. (permitAll) redirect URI는 provider에 사전 등록된 고정 경로여야 하므로 워크스페이스 경로를 쓰지 않는다 — workspaceId는 서명된 state에서 복원한다.
      operationId: completeWorkspaceIntegration
      parameters:
      - name: provider
        in: path
        description: 연동 provider (LINEAR, GITHUB)
        required: true
        schema:
          type: string
          description: 연동 provider (LINEAR, GITHUB)
          nullable: false
          enum:
          - LINEAR
          - GITHUB
        example: LINEAR
      - name: code
        in: query
        description: provider가 발급한 authorization code (성공 콜백)
        required: false
        schema:
          type: string
          description: provider가 발급한 authorization code (성공 콜백)
          nullable: false
        example: auth-code
      - name: state
        in: query
        description: 서명된 OAuth state (성공 콜백)
        required: false
        schema:
          type: string
          description: 서명된 OAuth state (성공 콜백)
          nullable: false
        example: signed-state
      - name: error
        in: query
        description: provider가 거부·오류 시 전달하는 코드 (실패 콜백)
        required: false
        schema:
          type: string
          description: provider가 거부·오류 시 전달하는 코드 (실패 콜백)
          nullable: false
        example: access_denied
      - name: Cookie
        in: header
        description: integration_oauth_nonce_{provider} — 성공 콜백에 필요한 nonce 쿠키
        required: false
        schema:
          type: string
      responses:
        '302':
          description: '302'
          headers:
            Location:
              description: 연동 결과를 담은 웹 리다이렉트 URL
              schema:
                type: string
      security: []
