      - "error"
      - "success"
      type: "object"
      properties:
        data:
          $ref: "#/components/schemas/ActionItem"
        success:
          type: "boolean"
          nullable: false
          example: true
        error:
          nullable: true
          enum:
          - null
          description: "성공 시 null인 오류 정보"
    ActionItemUpdateRequest:
      title: "ActionItemUpdateRequest"
      description: "부분 수정. 키가 없으면 그대로 둔다."
      type: "object"
