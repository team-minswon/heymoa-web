                value:
                  participantId: null
              assignNoteSpeaker_ParticipantNotInNoteException:
                value:
                  participantId: 0HZX2K7M9Q4AQ
              assignNoteSpeaker_Success:
                value:
                  participantId: 0HZX2K7M9Q4AP
