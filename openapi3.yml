          minLength: 13
          maxLength: 13
        example: 0HZX2K7M9Q4AF
      - name: candidateId
        in: path
        description: candidate 식별자
        required: true
        schema:
          type: string
          description: candidate 식별자
          nullable: false
          pattern: ^[0-9A-HJKMNP-TV-Z]{13}$
