  /v1/agent-chats/{chatId}/approvals/{approvalId}/resolve:
    post:
      tags:
      - AgentChat
      summary: 도구 승인/거절
      description: 승인 카드에 대한 응답. **202 로 턴 id 를 돌려준다** — 답의 나머지 절반은 같은 턴의 스트림으로 온다. GET /messages 의 cursor(카드의 entryId) 를 after 로 넣어 다시 붙는다. 본문은 decision 한 필드뿐이고 질문과 범위는 그 턴의 USER 행에서 다시 읽는다. 그 승인을 부른 본인만 호출할 수 있다 — 아니면 403. 승인 요청이 없거나 이미 처리됐거나 heymoa-ai 가 멈춰 선 자리가 그 승인이 아니면 404, decision 이 APPROVED/REJECTED 가 아니면 400이다.
      operationId: resolveToolApproval
      parameters:
      - name: chatId
        in: path
        description: 채팅 세션의 13자리 TSID
        required: true
        schema:
          type: string
          description: 채팅 세션의 13자리 TSID
          nullable: false
          pattern: ^[0-9A-HJKMNP-TV-Z]{13}$
          minLength: 13
          maxLength: 13
        example: 0K9GVJT2C4Q2A
      - name: approvalId
        in: path
        description: 승인 요청의 13자 TSID (heymoa-ai 발급)
        required: true
        schema:
          type: string
          description: 승인 요청의 13자 TSID (heymoa-ai 발급)
          nullable: false
          pattern: ^[0-9A-HJKMNP-TV-Z]{13}$
          minLength: 13
          maxLength: 13
        example: 0K9GVJT2C4Q7F
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveToolApprovalRequest'
            examples:
              resolveToolApproval_Success:
                value:
                  decision: APPROVED
              resolveToolApproval_BadRequest:
                value:
                  decision: MAYBE
              resolveToolApproval_ApprovalNotFoundException:
                value:
                  decision: REJECTED
              resolveToolApproval_NotApprovalOwnerException:
                value:
                  decision: APPROVED
      responses:
        '202':
          description: '202'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentChatTurnStartedResponse'
              examples:
                SUCCESS:
                  value:
                    success: true
                    data:
                      turnId: 0K9GVJT2C4Q3B
