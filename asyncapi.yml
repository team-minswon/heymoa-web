# heymoa-web ↔ heymoa-server SSE 구간 계약. 이 파일이 원본이다.
#
# - agent 채팅 SSE 구간과 사용자 이벤트 스트림(`GET /v1/events`) 구간을 담는다. server는 채팅 이벤트를 변환 없이
#   통과시켜 자기 DTO를 갖지 않으므로 server 쪽 DocsTest로 검증할 수 없다. SSE 이벤트 스키마의 단일 출처가 여기이며
#   asyncapi-server-ai.yml이 $ref로 참조한다.
# - 전사 STOMP·노트 토픽 구간은 asyncapi-web-server-stomp.yml 에 있다(APP-1620에서 떼어 냄). 그 파일은
#   heymoa-server/asyncapi.yml 의 바이트 사본이라 `diff` 로 미러 일치를 확인한다.
# - `accessCookie` 보안 스킴과 `Tsid` 스키마는 두 파일에 같은 정의로 있다. 파일 하나만 읽어도 해석되게 둔 것이다.
asyncapi: 3.0.0
info:
  title: Heymoa web ↔ server SSE 계약 (agent 채팅 + 사용자 이벤트)
  version: 6.0.0
  description: |
    브라우저와 heymoa-server 사이의 비동기 구간은 셋이다. 프로토콜도 수명도 다르다.

    | | 전사·노트 토픽 | agent 채팅 | 사용자 이벤트 |
    |---|---|---|---|
    | 프로토콜 | STOMP 1.2 over WebSocket (`wss`) | SSE (`GET …/turns/{turnId}/events`) | SSE (`GET /v1/events`) |
    | 서버 | `production` | `sseEdge` | `sseEdge` |
    | 생산자 | heymoa-server | heymoa-ai (Valkey Stream 에 쓰고 server 가 읽어 흘린다) | heymoa-server |
    | 수명 | 회의 녹음 구간 전체 | 메시지 한 건의 응답 | 로그인한 탭 하나(약 25분마다 다시 붙음) |
    | 인증 | 연결 티켓 `?ticket=`(없으면 `access_token` cookie, 이행 경로) | `access_token` cookie | `access_token` cookie |

    브라우저는 heymoa-ai에 직접 연결하지 않는다 — heymoa-server가 유일한 public edge다.

    전사·노트 토픽(STOMP) 구간의 계약은 `asyncapi-web-server-stomp.yml` 이다. 아래 표의 첫 열은 비교를 위해 남겼다.

    ---

    ## 1. agent 채팅 SSE 구간

    유저 메시지 `POST /v1/agent-chats/{chatId}/messages` 는 `202 {turnId}` 로 끝난다(스키마는
    openapi3-server.yml). 프레임은 그 뒤 브라우저가 여는 **하나의 진입점**으로 온다.

    - `GET /v1/agent-chats/{chatId}/turns/{turnId}/events?after={entryId}`

    첫 연결도 재접속도 같은 길이다. `after` 가 없으면 턴의 처음부터, 있으면 그 뒤부터 준다.
    `Last-Event-ID` 헤더도 같은 뜻으로 받는다(둘 다 있으면 `after`).

    **끊긴다고 턴이 끝나는 것이 아니다.** 프레임은 heymoa-ai 가 Valkey Stream `heymoa:turn:{turnId}`
    에 쓰고 server 는 그것을 읽어 흘릴 뿐이라, 브라우저가 닫혀도 server 가 죽어도 턴은 계속
    돈다. 돌아온 브라우저는 마지막 `id:` 를 `after` 에 넣어 다시 붙는다. 페이지를 새로 연 브라우저는
    `GET /v1/agent-chats/{chatId}/messages` 의 `activeTurn.turnId` 와 `cursor` 로 붙는다.

    ★ **밀린 것은 히스토리가 한 덩어리로 준다** (APP-632). 도는 턴의 **안 굳은 구간**도 `messages`
    에 행으로 실려 오고, `cursor` 는 그 구간의 마지막 프레임이라 이 스트림은 **그 뒤 새 것만** 준다.
    둘은 한 몸이라 따로 못 움직인다 — 커서만 옮기면 생각·도구가 어디에서도 안 오고, 행만 실으면
    스트림이 같은 것을 또 보낸다.

    그래서 받는 쪽은 **답 조각을 이어 붙여야 한다.** 히스토리의 마지막 `ASSISTANT` 행이 답의
    앞부분이고 이 스트림의 `token` 이 그 뒤를 잇는다. 둘을 따로 그리면 답이 두 덩어리로 서고,
    `message_end` 뒤에는 앞부분이 겹쳐 보인다. **이 어긋남은 오류를 안 낸다** — `cursor` 는 타입이
    안 바뀌어서 계약 생성도 타입 검사도 그냥 지나간다.

    **범위는 대화가 아니라 이 요청이 든다.** 본문의 `noteIds`·`projectIds`가 이 턴에 **먼저 볼 곳**이고
    담장이 아니다 — 거기 없으면 워크스페이스 안에서 더 찾는다. 못 넘는 선은 워크스페이스 하나뿐이고
    그것은 범위가 아니라 권한이다. **넓힌 것은 `message_end.refs`에 서서 드러난다.**

    실제 이벤트 생산자는 heymoa-ai이고 server는 `data` 를 **변환 없이** 흘리면서 턴이 끝날 때
    히스토리만 자기 DB에 저장한다. 그래서 이 구간과 server↔ai 구간(asyncapi-server-ai.yml)의
    `data` 스키마는 같다.

    턴 이벤트 둘(`turn_failed`·`turn_cancelled`)은 예외다 — **server가 스스로 만든다.** ai는 이것들을 모른다.

    ### 프레임은 `id:` + `event:` + `data:`다

    ```
    id: 1735689600000-0
    event: token
    data: {"delta":"회의에서 정한"}
    ```

    `id:` 줄이 **Valkey Stream 의 entry id** 다. 브라우저에게는 불투명한 문자열이다 — 크기를 비교하지
    않고, 마지막에 본 것을 그대로 `?after=`에 넣는다. 승인으로 턴이 멈췄다 재개돼도 같은 스트림에
    이어지므로 커서가 승인 경계를 넘는다.

    **봉투는 없다.** `data:`에 실리는 것은 payload 하나뿐이고 `chatId`·`turnId` 는 URL 이 든다.

    **`id:` 가 없는 프레임은 하트비트뿐이다.** 주석 프레임이라 커서를 안 옮긴다. `turn_started` 와
    `stream_resync` 는 사라졌다 — `turnId` 는 `202` 본문이 주고, 스트림이 사라진 것은 `410` 이 말한다.

    ### 스트림은 두 가지로 끝난다 — 그리고 세 번째가 있다

    1. `message_end` — 정상. `content`가 완성된 응답 전문이고 server가 이 값을 저장한다.
       **server 는 이 프레임을 보내기 전에 저장한다.** 받자마자 `GET /messages` 를 읽어도 답이 있다.
    2. `turn_failed` — 턴이 실패로 확정됐다. `error`가 앞서 올 수도 있고 **안 올 수도 있다**
       (ai 가 요청을 거절했으면 `error` 없이 이것이 첫 프레임이다).
    3. **종료 이벤트 없이 연결만 끊긴다.** 이것은 실패가 아니다 — **턴은 서버에서 살아 있을 수
       있다.** web은 같은 URL 에 `after` 를 넣어 다시 붙고, 포기했을 때만 정지로 그린다.

    `turn_cancelled`도 terminal이다. server는 이 셋(`message_end`·`turn_failed`·`turn_cancelled`)
    또는 `tool_approval_request` 를 흘려보낸 뒤 **연결을 닫는다.** `error` 는 닫지 않는다 —
    뒤따르는 `turn_failed` 가 닫는다.

    턴이 끝났고 스트림이 TTL(마지막 프레임 뒤 600초)로 사라졌으면 `410` 이다. web 은
    `GET /messages` 를 다시 읽는다 — 답은 거기 있다.

    ### heartbeat

    server는 SSE comment(`: keepalive`)를 **20초 이하 간격**(현재 구현 10초)으로 보낸다.
    프록시·로드 밸런서의 유휴 타임아웃에 **도는 턴**이 먼저 끊기는 것을 막기 위함이다.
    승인 대기는 근거가 아니다 — `tool_approval_request`가 스트림을 끝내므로 대기가
    스트림을 붙잡지 않는다. comment는 이벤트가 아니라 web은 무시하면 된다.

    스트림 절대 상한은 **30분**이다. 좀비 스트림 방지용이다.

    ### 스트림이 열리기 전의 실패는 SSE가 아니라 JSON이다

    소유권(404)·다른 대화의 턴(404)·스트림 소멸(410)·구독 상한(503)은 스트림을 열기 전 동기 단계에서
    끝난다. web은 응답 Content-Type을 보고 갈라야 한다 — 이 경우는 SSE가 아니라 평소의 오류 JSON이다
    (본문 스키마는 openapi3-server.yml).

    ---

    ## 2. 사용자 이벤트 스트림 구간

    `GET /v1/events` 는 로그인한 사용자 한 명에게 **무엇이 바뀌었는지만** 알린다. 값은 싣지 않는다 —
    받은 쪽이 해당 REST 를 다시 읽는다. 순서와 전달을 보장하지 않고, 유실은 다시 붙을 때의 전체 다시 읽기와
    안전망 폴링이 메운다.

    - 구독 등록이 끝나면 `ready` 가 먼저 오고, 그 뒤에 커밋된 변경이 힌트로 온다.
    - **`id:` 줄이 없다.** `Last-Event-ID`·재생도 없다. 다시 붙으면 소유 쿼리를 전부 다시 읽는다.
    - 하트비트는 주석 `: keepalive` 이고 15초 안팎이다.
    - 서버는 min(약 25분 ± 2분, 인증 토큰 만료) 또는 배포 드레인 때 정상으로 닫는다. 브라우저는 곧바로 다시 붙는다.
    - 워크스페이스 힌트는 그 워크스페이스 멤버에게, 사용자 힌트는 그 사용자의 연결에만 간다. 허용 워크스페이스는
      연결 중에도 30~60초마다 다시 확인해 보내기 전에 거른다(`membership.changed` 는 거르지 않는다).
    - **모르는 이벤트 이름과 필드는 무시한다.** 롤링 배포 중 새 서버가 새 힌트를 먼저 내도 연결이 산다.
    - 스트림을 열기 전의 실패(꺼진 서버 404, 사용자당 연결 상한 429, 인스턴스 상한 503 + `Retry-After`)는
      SSE가 아니라 평소의 오류 JSON이다(openapi3-server.yml). 404 를 받으면 다시 붙지 않고 폴링을 유지한다.

    원본은 이 파일이다 — server 쪽 이벤트 이름·필드 정본은 `UserEventHint`(힌트)와 `EventStreamRegistry`(`ready`·`resync`·`degraded`)이고,
    여기 적은 모양과 함께 고친다.
defaultContentType: application/json
servers:
  sseEdge:
    host: api.heymoa.app
    protocol: https
    description: |
      agent 채팅 SSE와 사용자 이벤트 SSE. 별도 endpoint가 아니라 REST와 같은 public edge이며,
      `GET /v1/agent-chats/{chatId}/turns/{turnId}/events` 와 `GET /v1/events` 가 `text/event-stream` 으로 열린다.
    security:
      - $ref: "#/components/securitySchemes/accessCookie"
channels:
  agentChatStream:
    servers:
      - $ref: "#/servers/sseEdge"
    address: /v1/agent-chats/{chatId}/turns/{turnId}/events
    title: 개인 챗봇 턴 스트림
    description: |
      `POST /v1/agent-chats/{chatId}/messages` 가 `202 {turnId}` 로 연 턴의 프레임을 나르는 SSE 스트림이다.
      `?after={entryId}` 로 그 뒤부터 이어받는다. 첫 연결과 재접속이 같은 주소다.

      **범위는 턴마다 붙는다** — 대화가 아니라 그 메시지가 든다. 같은 대화 안에서 매 질문의
      범위가 다를 수 있고, 히스토리의 USER 행이 그때 쓴 범위를 그대로 들고 있다.

      **한 대화에 도는 턴은 하나다.** 도는 중에 또 보내면 409에 그 턴의 id가 실려 온다.
      그건 실패가 아니라 **이어받기 신호**다 — `GET /v1/agent-chats/{chatId}/messages`가
      `activeTurn`과 `cursor`를 준다.

      승인으로 턴이 멈추면 `tool_approval_request` 로 닫히고, 승인 `POST …/resolve` 가 `202` 로 답한 뒤
      **같은 주소**에 `after` 를 넣어 다시 붙으면 나머지 절반이 온다.
    parameters:
      chatId:
        $ref: "#/components/parameters/chatId"
      turnId:
        $ref: "#/components/parameters/turnId"
    messages:
      TurnFailed:
        $ref: "#/components/messages/TurnFailed"
      TurnCancelled:
        $ref: "#/components/messages/TurnCancelled"
      MessageStart:
        $ref: "#/components/messages/MessageStart"
      Token:
        $ref: "#/components/messages/Token"
      ThinkingDelta:
        $ref: "#/components/messages/ThinkingDelta"
      ToolCallStart:
        $ref: "#/components/messages/ToolCallStart"
      ToolApprovalRequest:
        $ref: "#/components/messages/ToolApprovalRequest"
      ToolApprovalResolved:
        $ref: "#/components/messages/ToolApprovalResolved"
      ToolCallResult:
        $ref: "#/components/messages/ToolCallResult"
      MessageEnd:
        $ref: "#/components/messages/MessageEnd"
      Error:
        $ref: "#/components/messages/Error"
  userEventStream:
    servers:
      - $ref: "#/servers/sseEdge"
    address: /v1/events
    title: 사용자 이벤트 스트림
    description: |
      로그인한 사용자 단위의 변경 힌트 스트림이다(§2). 프레임은 `event:` + `data:` 이고 `id:` 가 없다.
      `data:` 는 JSON 객체 하나다. 이벤트 이름이 곧 메시지 이름이다.
    messages:
      UserEventsReady:
        $ref: "#/components/messages/UserEventsReady"
      NoteChanged:
        $ref: "#/components/messages/NoteChanged"
      NotesChanged:
        $ref: "#/components/messages/NotesChanged"
      ChatsChanged:
        $ref: "#/components/messages/ChatsChanged"
      NotificationsChanged:
        $ref: "#/components/messages/NotificationsChanged"
      MembershipChanged:
        $ref: "#/components/messages/MembershipChanged"
      UserEventsResync:
        $ref: "#/components/messages/UserEventsResync"
      UserEventsDegraded:
        $ref: "#/components/messages/UserEventsDegraded"
operations:
  receiveAgentChatEvents:
    action: receive
    summary: heymoa-web이 개인 챗봇 턴의 프레임을 SSE로 수신한다.
    description: |
      server가 producer지만 이벤트를 만들지는 않는다 — heymoa-ai 가 Valkey Stream 에 쓴 프레임을
      읽어 변환 없이 흘리고, 턴이 끝날 때 유저 메시지·`message_end.content`·`message_end.refs`·
      도구 실행 기록·생각을 자기 DB에 저장한다.

      **턴 이벤트 둘은 반대다** — ai가 모르고 server가 만든다. 턴 행·취소 엔드포인트가 server 것이라,
      「이 턴이 어떻게 끝났나」를 굳히는 곳이 server뿐이다.
    channel:
      $ref: "#/channels/agentChatStream"
    messages:
      - $ref: "#/channels/agentChatStream/messages/TurnFailed"
      - $ref: "#/channels/agentChatStream/messages/TurnCancelled"
      - $ref: "#/channels/agentChatStream/messages/MessageStart"
      - $ref: "#/channels/agentChatStream/messages/Token"
      - $ref: "#/channels/agentChatStream/messages/ThinkingDelta"
      - $ref: "#/channels/agentChatStream/messages/ToolCallStart"
      - $ref: "#/channels/agentChatStream/messages/ToolApprovalRequest"
      - $ref: "#/channels/agentChatStream/messages/ToolApprovalResolved"
      - $ref: "#/channels/agentChatStream/messages/ToolCallResult"
      - $ref: "#/channels/agentChatStream/messages/MessageEnd"
      - $ref: "#/channels/agentChatStream/messages/Error"
  receiveUserEvents:
    action: receive
    summary: heymoa-web이 사용자 단위 변경 힌트를 SSE로 수신한다.
    description: |
      server가 생산자다. 커밋된 변경을 Valkey pub/sub 으로 모든 인스턴스에 알리고, 각 인스턴스가 자기 연결에
      걸러 보낸다. 힌트를 받은 화면은 그 힌트가 가리키는 REST 쿼리를 무효화해 다시 읽는다.
    channel:
      $ref: "#/channels/userEventStream"
    messages:
      - $ref: "#/channels/userEventStream/messages/UserEventsReady"
      - $ref: "#/channels/userEventStream/messages/NoteChanged"
      - $ref: "#/channels/userEventStream/messages/NotesChanged"
      - $ref: "#/channels/userEventStream/messages/ChatsChanged"
      - $ref: "#/channels/userEventStream/messages/NotificationsChanged"
      - $ref: "#/channels/userEventStream/messages/MembershipChanged"
      - $ref: "#/channels/userEventStream/messages/UserEventsResync"
      - $ref: "#/channels/userEventStream/messages/UserEventsDegraded"
components:
  securitySchemes:
    accessCookie:
      type: httpApiKey
      name: access_token
      in: cookie
      description: 로그인 시 발급된 access token cookie
  parameters:
    chatId:
      description: heymoa-server가 발급한 개인 채팅 세션 id (13자 TSID)
      examples:
        - 0HZX2K7M9Q4AE
    turnId:
      description: |
        `POST /v1/agent-chats/{chatId}/messages` 의 `202` 본문이 준 턴 id (13자 TSID).
        승인으로 멈췄다 재개돼도 같은 턴이다.
      examples:
        - 0K9GVJT2C4Q3B
  messages:
    TurnFailed:
      name: turn_failed
      title: 턴 실패 확정
      description: |
        terminal. `error`가 앞서 올 수도 있고 **안 올 수도 있다** — `UPSTREAM_REJECTED`는
        ai가 턴 시작 요청을 4xx로 거절한 것이라 `error` 이벤트가 없고 이것이 첫 프레임이다.
        server 가 턴을 실패로 굳히면서 스트림에 쓴다(ai 의 `error` 뒤에도, 워치독의 시간 초과에도).
        이 갈래를 안 열면 그 경로가 조용히 삼켜지고 화면이 EOF까지 로딩으로 남는다.

        **사람이 읽을 문구는 안 싣는다.** `code`가 닫힌 enum이라 web이 문구를 만든다 —
        server가 문구를 보내면 같은 실패의 표현이 두 곳에 갈린다.
      payload:
        type: object
        required: [turnId, code, retryable]
        properties:
          turnId:
            $ref: "#/components/schemas/Tsid"
          code:
            type: string
            enum:
              - TURN_TIMEOUT
              - UPSTREAM_ERROR
              - UPSTREAM_REJECTED
              - APPROVAL_EXPIRED
              - STREAM_INTERRUPTED
              - CAPACITY_EXCEEDED
              - SERVICE_RESTARTING
              - INTERNAL_ERROR
          retryable:
            type: boolean
            description: |
              다시 눌러도 되나. **server가 정한다** — `code`에서 파생하는 값이라 web이
              다시 구현하면 판정이 두 곳으로 갈린다.
      examples:
        - name: turnFailed
          payload:
            turnId: 0K9GVJT2C4Q3B
            code: UPSTREAM_ERROR
            retryable: true
    TurnCancelled:
      name: turn_cancelled
      title: 턴 취소 확정
      description: |
        terminal. **발행하는 것은 `POST /v1/agent-chats/{chatId}/turns/{turnId}/cancel`
        하나뿐이다** — ai 는 취소 키를 보고 조용히 멈출 뿐 이 이벤트를 안 쓴다(두 벌이 된다).

        취소 API의 204는 「접수했다」가 아니라 **「굳혔다」**이고 멱등이다(이미 끝난 턴에도
        204). 그때까지 흐른 토큰은 부분 답으로 저장된다. 화면이 멈추는 신호는 204가 아니라 이 프레임이다.
      payload:
        type: object
        required: [turnId]
        properties:
          turnId:
            $ref: "#/components/schemas/Tsid"
      examples:
        - name: turnCancelled
          payload:
            turnId: 0K9GVJT2C4Q3B
    MessageStart:
      name: message_start
      title: 응답 시작
      description: |
        assistant 응답 스트림의 시작.

        **한 턴에 여러 번 올 수 있다** — 승인 흐름이 한 턴을 두 조각으로 자른다. 재접속 재생에도
        섞여 온다. **받고 상태를 리셋하면 방금 복원한 블록을 지운다.**
      payload:
        type: object
        required: [chatId, messageId]
        properties:
          chatId:
            $ref: "#/components/schemas/Tsid"
          messageId:
            type: string
            description: 이 assistant 응답의 id
      examples:
        - name: messageStart
          payload:
            chatId: 0HZX2K7M9Q4AE
            messageId: 0HZX2K7M9Q4AG
    Token:
      name: token
      title: 텍스트 델타
      description: |
        assistant 응답 텍스트 조각. 수신 순서대로 이어붙인다. **누적 snapshot이 아니라 델타다**
        (전사 partial과 반대다 — 그쪽은 교체, 이쪽은 append).
      payload:
        type: object
        required: [delta]
        properties:
          delta:
            type: string
      examples:
        - name: token
          payload:
            delta: 회의에서 정한
    ThinkingDelta:
      name: thinking_delta
      title: 계획 문장 델타
      description: |
        모델이 답을 쓰기 전에 흘린 계획 문장이다. **`token`과 갈라야 답변 본문이 깨끗하다** —
        예전에는 이 문장이 `token`으로 나가 응답 전문에 섞였고, 그래서 `message_end.content`에
        "이제 전사를 검색하겠습니다" 같은 줄이 남았다.

        갈림의 기준은 "생각인가 답인가"가 아니라 **"뒤에 도구 호출이 붙었나"**다. 모델이 도구를
        부를 듯 말 듯 하면 같은 성격의 문장이 다른 채널로 나갈 수 있다.

        `content`에는 안 들어간다. web은 이것을 답변 본문과 다른 자리에 그린다.
      payload:
        type: object
        required: [text]
        properties:
          text:
            type: string
      examples:
        - name: thinkingDelta
          payload:
            text: 주간 배포 회의 전사에서 롤백 언급을 찾는다
    ToolCallStart:
      name: tool_call_start
      title: 도구 호출 시작
      description: |
        agent가 외부 도구(Linear, GitHub 등) 호출을 시작했다. **조회(read) 도구만 이 이벤트로
        바로 시작한다** — 쓰기 도구는 tool_approval_request를 먼저 거친다.
      payload:
        type: object
        required: [toolCallId, tool]
        properties:
          toolCallId:
            type: string
          tool:
            type: string
            description: 도구 이름 (예 linear.create_issue, github.create_issue)
          summary:
            type: string
            description: UI 표시용 한 줄 설명 (예 "Linear 이슈 생성 중")
          target:
            allOf:
              - $ref: "#/components/schemas/ToolTarget"
            description: |
              이 도구가 향하는 곳. **web이 누를 수 있는 칩으로 그린다** — 눌러서 그 회의록으로 간다.
              문자열 `summary`만으로는 링크를 만들 수 없어서 구조를 따로 내린다.
          args:
            type: object
            nullable: true
            description: |
              모델이 이 도구를 부른 인자. **승인 카드가 「무엇을 승인하나」를 말하는 근거다** —
              `{approvalId, tool, summary}`만으로는 어느 프로젝트에 어떤 설명으로 만드는지를
              못 보여준다.

              **인자를 나르는 것은 이 프레임 하나뿐이다.** `tool_approval_request`에는 안 실린다 —
              같은 값이 두 프레임에 나가면 어느 쪽이 정본인지 흐려지고, `toolCallId`가 둘을 잇는다.
              끊겼다 돌아온 자리는 히스토리의 `activeTurn.pendingApproval.args`가 받는다.

              **서버도 화면도 해석하지 않는다.** 인자 없는 도구는 `null`이고 그때 카드는 요약만으로 묻는다.
      examples:
        - name: toolCallStart
          payload:
            toolCallId: call_01
            tool: transcripts.search
            summary: 전사에서 '롤백' 검색
            target:
              kind: note
              id: 0HZX2K7M9Q4AF
              title: 주간 배포 회의
            args:
              query: 롤백
    ToolApprovalRequest:
      name: tool_approval_request
      title: 쓰기 도구 승인 요청
      description: |
        agent가 쓰기 도구를 실행하기 전 입력자 승인을 요청한다.

        **이 이벤트가 첫 조각의 마지막 프레임이다** — server는 턴을 `WAITING_APPROVAL`로
        굳힌 뒤 이것을 흘려보내고 연결을 닫는다. 그러니 **EOF를 실패로 읽으면 안 된다.**
        승인 API(`POST /v1/agent-chats/{chatId}/approvals/{approvalId}/resolve`)가 `202` 로 답하면
        **같은 턴 스트림에 `after`(이 카드의 `id:`)를 넣어 다시 붙는다.** 그 첫 프레임이
        tool_approval_resolved다.

        **만료가 없다** — 승인은 사람이 답할 때까지 산다. 답 없는 대기를 푸는 것은 취소 API뿐이고,
        취소된 턴의 카드는 승인 API에서 404로 걸린다(그 턴이 `WAITING_APPROVAL`이 아니다).
      payload:
        type: object
        required: [approvalId, toolCallId, tool]
        properties:
          approvalId:
            allOf:
              - $ref: "#/components/schemas/Tsid"
            description: |
              승인 API 호출에 쓰는 id. **heymoa-ai가 13자 TSID로 발급한다** —
              server의 승인 API path에 그대로 노출되는 공개 식별자이고,
              server는 외부 식별자를 13자 TSID로 통일한다.
              **server는 이 모양을 검사하지 않는다**(APP-639). 어긴 값은 그대로 저장되어
              승인 API path와 히스토리 응답에 실리므로, 계약을 지키는 것은 발급 주체인 ai다.
            pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
            examples: ["0K9GVJT2C4Q7F"]
          toolCallId:
            type: string
          tool:
            type: string
            description: 도구 이름 (예 linear.create_issue)
          summary:
            type: string
            description: |
              승인 카드의 한 줄 평문 (예 "Linear 이슈 만들기 · APP 버그 수정"). **`card` 가 없을 때의
              폴백이다** — `card` 가 오면 web 은 카드를 그리고 이 줄은 목록·알림 같은 한 줄 자리에만 쓴다.
          card:
            type: object
            required: [title, fields]
            description: |
              승인 카드의 구조다. **모든 값은 사람이 읽는 이름이다. id 를 싣지 않는다** — 담당자·프로젝트·
              노트는 이름으로 적는다.

              **card 는 표시 전용이고 실행은 인자(args)로 한다.** heymoa-ai 는 card 를 모델이 쓴 글이 아니라
              실행할 그 요청 본문과 승인 전에 읽은 이름·지금 값에서 만들고, card 의 지문을 인자 지문과 함께
              묶어 승인 뒤 어느 쪽이든 달라지면 실행하지 않는다. **web 은 모든 값을 평문 텍스트로만 그린다**
              (마크다운·HTML·링크로 해석하지 않는다). 도구마다의 실제 출력은 `contracts/examples/approval-cards.json`.

              `fields` 의 한 줄은 `value` 하나이거나, 바뀌는 값이면 `before` + `after` 둘이다(변경 줄).
              `before` 가 비어 있던 값이면 「없음」이다. 명단을 통째로 바꾸는 줄은 `added`·`removed`·`kept`
              (이름 목록)를 싣는다. 여러 대상을 한 번에 바꾸면 대상마다 `items` 한 칸이다.

              `body` 는 메일·이슈·댓글처럼 긴 본문이다. **마크다운이 아니라 평문이고 줄바꿈을 그대로 그린다.**

              `target` 은 무엇에 하는지(대상) 한 줄이다. 대상이 `title`·`target` 에 나오면 `fields` 에
              같은 줄을 다시 두지 않는다.

              `warning` 은 되돌릴 수 없는 일(보낸 메일, 삭제)에만 온다.
            properties:
              title:
                type: string
                description: 카드 제목. 무엇을 하는지 (예 「Linear 이슈 만들기」)
              target:
                type: string
                description: |
                  사람이 읽는 대상 한 줄 (예 「멘토링 · [시험] PRO-56 운영 확인」, 메일은 회의록 제목).
                  제목 아래 작은 줄로 그린다. **여기 나온 대상은 `fields` 에서 반복하지 않는다.**
              warning:
                type: string
                description: 되돌릴 수 없을 때 한 줄 경고 (예 「보낸 메일은 거둘 수 없습니다」)
              fields:
                type: array
                description: 표시 순서대로. 비어 있을 수 있다
                items:
                  $ref: "#/components/schemas/ApprovalCardField"
              items:
                type: array
                description: |
                  일괄 쓰기의 대상마다 한 칸이다. 모든 대상에 같은 변경이면 그 변경은 바깥 `fields` 에 두고
                  여기에는 이름(`title`)만 둔다.
                items:
                  type: object
                  required: [title, fields]
                  properties:
                    title:
                      type: string
                      description: 대상 이름 (예 할 일 내용)
                    target:
                      type: string
                      description: 대상이 속한 곳 (예 프로젝트 이름)
                    fields:
                      type: array
                      description: 이 대상만의 줄. 모양은 바깥 `fields` 와 같다
                      items:
                        $ref: "#/components/schemas/ApprovalCardField"
              body:
                type: object
                required: [label, text]
                properties:
                  label:
                    type: string
                    description: 본문 이름 (예 「본문」·「설명」·「댓글」)
                  text:
                    type: string
                    description: 평문. 줄바꿈을 보존한다
      examples:
        - name: approvalRequest
          payload:
            approvalId: 0K9GVJT2C4Q7F
            toolCallId: call_02
            tool: linear.create_issue
            summary: Linear 이슈 만들기 · APP 버그 수정
            card:
              title: Linear 이슈 만들기
              target: APP 버그 수정
              fields:
                - label: 팀
                  value: App
                - label: 담당자
                  value: 김민수
              body:
                label: 설명
                text: |-
                  로그인 후 홈이 비어 보입니다.
                  재현: 새로고침 없이 탭 전환
        - name: approvalRequestChange
          payload:
            approvalId: 0K9GVJT2C4Q7G
            toolCallId: call_03
            tool: heymoa.task_update
            summary: 할 일 고치기 · 멘토링 · 배포 체크리스트 정리
            card:
              title: 할 일 고치기
              target: 멘토링 · 배포 체크리스트 정리
              fields:
                - label: 담당자
                  before: 없음
                  after: 이지은
        - name: approvalRequestMail
          payload:
            approvalId: 0K9GVJT2C4Q7H
            toolCallId: call_04
            tool: heymoa.note_result_mail_send
            summary: 회의 결과 메일 보내기 · 주간 배포 회의
            card:
              title: 회의 결과 메일 보내기
              target: 주간 배포 회의
              warning: 보낸 메일은 거둘 수 없습니다
              fields:
                - label: 받는 사람
                  value: 김민수, 이지은
              body:
                label: 본문
                text: |-
                  오늘 회의에서 정한 것입니다.
                  - 금요일 배포
        - name: approvalRequestBatch
          payload:
            approvalId: 0K9GVJT2C4Q7J
            toolCallId: call_05
            tool: heymoa_batch_update_tasks
            summary: 할 일 한 번에 바꾸기 · 2건
            card:
              title: 할 일 한 번에 바꾸기
              fields:
                - label: 상태
                  before: 진행 중
                  after: 완료
              items:
                - title: 배포 체크리스트 정리
                  target: 멘토링
                  fields: []
                - title: 릴리스 노트
                  target: 멘토링
                  fields: []
        - name: approvalRequestRoster
          payload:
            approvalId: 0K9GVJT2C4Q7K
            toolCallId: call_06
            tool: heymoa_replace_note_participants
            summary: 참석 멤버 바꾸기 · 주간 배포 회의
            card:
              title: 참석 멤버 바꾸기
              target: 주간 배포 회의
              fields:
                - label: 참석 멤버
                  added: [이지은]
                  removed: [박도윤]
                  kept: [김민수]
    ToolApprovalResolved:
      name: tool_approval_resolved
      title: 승인 처리 결과
      description: |
        tool_approval_request와 `approvalId`로 짝을 이룬다.
        APPROVED면 도구가 실행되고 tool_call_result가 이어진다.
        REJECTED면 도구를 실행하지 않고 agent가 거절을 반영해 응답을 이어간다 —
        **어느 쪽이든 스트림은 정상 종료(message_end)된다.**

        server는 턴이 끝날 때 이 이벤트로 승인 상태를 확정하고 히스토리에 기록한다.
        **재개 조각의 첫 프레임으로 온다** — 승인 API 는 `202` 만 준다.
        확정의 단일 출처는 이 이벤트다.
      payload:
        type: object
        required: [approvalId, decision]
        properties:
          approvalId:
            $ref: "#/components/schemas/Tsid"
          decision:
            type: string
            enum: [APPROVED, REJECTED]
      examples:
        - name: approved
          payload:
            approvalId: 0K9GVJT2C4Q7F
            decision: APPROVED
    ToolCallResult:
      name: tool_call_result
      title: 도구 호출 결과
      description: |
        `toolCallId`로 tool_call_start(조회 도구) 또는 tool_approval_request(쓰기 도구)와 짝을 이룬다.
        짝을 못 찾으면 server는 도구 이름을 `unknown`으로 기록한다 — 이 값이 히스토리에 보이면
        시작 이벤트를 놓쳤다는 뜻이다.

        **status가 error여도 스트림은 계속된다** (agent가 실패를 반영해 응답). 도구 토큰
        만료(401)도 error 이벤트가 아니라 이 이벤트로 전달되며, 다음 메시지에서 server가 새 토큰을
        보내면 자연 복구된다.
      payload:
        type: object
        required: [toolCallId, status]
        properties:
          toolCallId:
            type: string
          status:
            type: string
            enum: [success, error]
          summary:
            type: string
            description: UI 표시용 결과 요약 (예 "APP-12 생성됨"). 에러 시 사유.
          url:
            type: string
            format: uri
            description: 생성·수정된 리소스 링크 (있는 경우)
      examples:
        - name: toolCallResult
          payload:
            toolCallId: call_02
            status: success
            summary: APP-12 생성됨
            url: https://linear.app/heymoa/issue/APP-12
    MessageEnd:
      name: message_end
      title: 응답 완료
      description: |
        정상 종료. `content`는 완성된 assistant 응답 전문이며 server가 이 값을 히스토리로 저장한다.
        토큰을 이어붙인 결과와 같아야 하고, **비어 있거나 문자열이 아니면 server가 스트림을
        실패로 끝낸다** (조용히 저장을 건너뛰지 않는다). `thinking_delta`로 나간 문장은 여기 없다.
      payload:
        type: object
        required: [messageId, content]
        properties:
          messageId:
            type: string
          content:
            type: string
            description: 완성된 assistant 응답 전문 (markdown)
          refs:
            type: array
            description: |
              **에이전트가 실제로 본 회의록**이다. 모델이 답에 인용했는지는 안 본다 — 그건 판정이
              필요하고, 지금 계약이 답하는 것은 "무엇을 봤나"다. 없으면 빈 배열이다.

              server가 이 값을 ASSISTANT 행의 `refs` JSONB로 저장하므로 새로고침 뒤에도 남는다.
              저장 시점에 노트가 지워졌거나 권한을 잃었으면 조회에서 「삭제됨」으로 접힌다.

              **범위 밖을 봤다는 알림도 여기다.** 범위는 힌트라 조회 도구가 밖을 안 막고,
              넓힌 것을 조용히 넓히지 않으려면 알릴 자리가 필요한데 그 자리가 이 목록이다 —
              범위 밖 회의록이 `refs`에 서는 것이 곧 알림이라 **새 프레임을 안 만든다**.
            items:
              $ref: "#/components/schemas/NoteRef"
      examples:
        - name: messageEnd
          payload:
            messageId: 0HZX2K7M9Q4AG
            content: 금요일 오후 6시로 정했습니다.
            refs:
              - kind: note
                id: 0HZX2K7M9Q4AF
                title: 주간 배포 회의
        - name: 범위 밖까지 보고 답한 턴
          payload:
            messageId: 0HZX2K7M9Q4AH
            content: 주간 배포 회의에는 없고 결제 개편 킥오프에서 정했습니다.
            refs:
              - kind: note
                id: 0HZX2K7M9Q4AF
                title: 주간 배포 회의
              - kind: note
                id: 0J2MQ7V4N8XYZ
                title: 결제 개편 킥오프
    Error:
      name: error
      title: 스트림 실패
      description: |
        복구 불가 오류. 이 이벤트 후 스트림이 종료되며 message_end는 오지 않는다.
        부분 스트리밍된 assistant 응답은 저장하지 않는다.

        도구 실패는 이 이벤트가 아니다 — tool_call_result(status=error)로 가고 스트림은 계속된다.
      payload:
        type: object
        required: [code, message]
        properties:
          code:
            type: string
            description: 기계 판독용 코드 (예 LLM_PROVIDER_ERROR, INTERNAL, SERVICE_RESTARTING)
          message:
            type: string
            description: UI 표시 가능한 사유
      examples:
        - name: providerFailure
          payload:
            code: LLM_PROVIDER_ERROR
            message: 응답 생성에 실패했습니다. 잠시 후 다시 시도해 주세요.
    UserEventsReady:
      name: ready
      title: 구독 시작
      description: |
        구독 등록이 끝났다는 신호이고 늘 첫 프레임이다. 이 뒤에 커밋된 변경만 힌트로 온다 — 받은 화면은
        이 시점에 소유 쿼리를 한 번 다시 읽어 놓친 것을 메운다.
      payload:
        type: object
        required: [v, connectionId, serverTime, maxAgeSec]
        properties:
          v:
            type: integer
            enum: [1]
            description: 스트림 프로토콜 판
          connectionId:
            $ref: "#/components/schemas/Tsid"
          serverTime:
            type: string
            format: date-time
            description: 연결을 연 서버 시각(UTC)
          maxAgeSec:
            type: integer
            minimum: 0
            description: 서버가 이 연결을 닫기까지 남은 초. 약 25분 ± 2분과 인증 토큰 만료 중 이른 쪽
      examples:
        - name: ready
          payload:
            v: 1
            connectionId: 0K9GVJT2C4Q4C
            serverTime: "2026-10-22T01:00:00Z"
            maxAgeSec: 1500
    NoteChanged:
      name: note.changed
      title: 노트 한 건이 바뀜
      description: |
        워크스페이스 멤버 전원에게 간다. `aspects` 가 무엇이 바뀌었는지 가른다 — `meeting`(회의 상태)·`analysis`(분석 흐름).
        `transcript`·`agendas`·`review` 는 이름만 예약돼 있고 지금은 안 나간다. 모르는 면은 걸러 내고 남은 것만 쓴다.
      payload:
        type: object
        required: [workspaceId, noteId, aspects]
        properties:
          workspaceId:
            $ref: "#/components/schemas/Tsid"
          noteId:
            $ref: "#/components/schemas/Tsid"
          aspects:
            type: array
            minItems: 1
            description: 바뀐 면. 이름순으로 정렬돼 온다
            items:
              type: string
              enum: [meeting, analysis, transcript, agendas, review]
      examples:
        - name: noteChanged
          payload:
            workspaceId: 0K9GVJT2C4Q2A
            noteId: 0K9GVJT2C4Q3B
            aspects: [analysis]
    NotesChanged:
      name: notes.changed
      title: 노트 목록이 바뀜
      description: 워크스페이스 멤버 전원에게 간다. `projectId` 가 없으면 워크스페이스 전체 노트 목록을 다시 읽는다.
      payload:
        type: object
        required: [workspaceId]
        properties:
          workspaceId:
            $ref: "#/components/schemas/Tsid"
          projectId:
            $ref: "#/components/schemas/Tsid"
      examples:
        - name: notesChanged
          payload:
            workspaceId: 0K9GVJT2C4Q2A
            projectId: 0K9GVJT2C4Q5D
    ChatsChanged:
      name: chats.changed
      title: 내 채팅 목록이 바뀜
      description: 그 사용자의 연결에만 간다. 채팅은 주인만 본다.
      payload:
        type: object
        required: [workspaceId]
        properties:
          workspaceId:
            $ref: "#/components/schemas/Tsid"
      examples:
        - name: chatsChanged
          payload:
            workspaceId: 0K9GVJT2C4Q2A
    NotificationsChanged:
      name: notifications.changed
      title: 내 알림이 바뀜
      description: 그 사용자의 연결에만 간다. 알림 목록과 안 읽은 개수를 다시 읽는다. 본문은 빈 객체다.
      payload:
        type: object
      examples:
        - name: notificationsChanged
          payload: {}
    MembershipChanged:
      name: membership.changed
      title: 내 워크스페이스 멤버십이 바뀜
      description: |
        그 사용자의 연결에만 간다 — 추가·역할 변경·이탈·추방. **추방된 워크스페이스의 것도 온다.** 서버는 이 힌트를
        받은 연결의 허용 워크스페이스를 곧바로 다시 계산한다.
      payload:
        type: object
        required: [workspaceId]
        properties:
          workspaceId:
            $ref: "#/components/schemas/Tsid"
      examples:
        - name: membershipChanged
          payload:
            workspaceId: 0K9GVJT2C4Q2A
    UserEventsResync:
      name: resync
      title: 힌트 유실 — 전부 다시 읽기
      description: 서버가 유실을 알 때 보낸다(이 연결의 대기열이 넘침). 받은 화면은 소유 쿼리 전체를 다시 읽는다. 연결은 이어진다.
      payload:
        type: object
        required: [reason]
        properties:
          reason:
            type: string
            enum: [overflow]
      examples:
        - name: resync
          payload:
            reason: overflow
    UserEventsDegraded:
      name: degraded
      title: 힌트를 더 못 보냄
      description: |
        서버가 힌트를 더 전하지 못하게 됐다 — `valkey`(서버의 힌트 구독 상실)·`server`(멤버십 재확인 실패). 보낸 뒤 서버가 연결을 닫는다.
        받은 화면은 원래 간격의 폴링으로 돌아간다.
      payload:
        type: object
        required: [reason]
        properties:
          reason:
            type: string
            enum: [valkey, server]
      examples:
        - name: degraded
          payload:
            reason: valkey
  schemas:
    ApprovalCardField:
      description: 승인 카드의 한 줄. `value` 하나, 바뀌는 값이면 `before`·`after`, 명단 교체는 `added`·`removed`·`kept`
      type: object
      required: [label]
      properties:
        label:
          type: string
        value:
          type: string
        before:
          type: string
          description: 바뀌기 전 값. 없던 값이면 「없음」
        after:
          type: string
          description: 바뀐 뒤 값
        added:
          type: array
          items: { type: string }
          description: 명단을 바꿀 때 새로 드는 이름
        removed:
          type: array
          items: { type: string }
          description: 명단을 바꿀 때 빠지는 이름
        kept:
          type: array
          items: { type: string }
          description: 명단을 바꿀 때 그대로 남는 이름
    Tsid:
      type: string
      pattern: "^[0-9A-HJKMNP-TV-Z]{13}$"
      example: 0HZX2K7M9Q4AB
    ToolTarget:
      type: object
      description: |
        도구 카드가 가리키는 곳. **`kind`를 enum으로 닫지 않는다** — 도구가 늘 때마다 계약을
        고치면 server 배포가 ai 배포에 묶인다. 모르는 `kind`가 오면 web은 `summary`로 폴백한다.
      required: [kind]
      properties:
        kind:
          type: string
          description: note · project · query
        id:
          type: string
          description: kind가 note·project일 때의 대상 id. query면 없다
        title:
          type: string
    NoteRef:
      type: object
      description: |
        이 턴에 근거로 쓴 회의록 하나. **본 것이지 인용한 것이 아니다.**
      required: [kind, id, title]
      properties:
        kind:
          type: string
          enum: [note]
        id:
          $ref: "#/components/schemas/Tsid"
        title:
          type: string